<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sobha | Change password</title>
<style>
  :root{--ink:#1b2431;--mute:#5b6b82;--line:#e3e8f0;--accent:#0F4F9E;--bg:#f4f6fa;--card:#ffffff;--neg:#b3261e;--neg-bg:#fbeceb;--pos:#1a7a3d;--pos-bg:#e7f6ec}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);
    font:14px -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:var(--ink)}
  .card{width:min(360px,92vw);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:28px}
  h1{margin:0 0 6px;font-size:17px}
  p.lead{margin:0 0 18px;color:var(--mute);font-size:12.5px}
  form{display:flex;flex-direction:column;gap:10px}
  label{font-size:11.5px;color:var(--mute);font-weight:600;margin-bottom:-4px}
  input{height:36px;border:1px solid var(--line);border-radius:6px;padding:0 11px;font:13px inherit;outline:none}
  input:focus{border-color:var(--accent)}
  button{margin-top:6px;height:38px;border:0;border-radius:6px;background:var(--accent);color:#fff;font:600 13px inherit;cursor:pointer}
  button:hover{background:#0d4487}
  button:disabled{opacity:.6;cursor:default}
  .msg{margin-top:12px;font-size:12.5px;border-radius:7px;padding:9px 11px;display:none}
  .msg.err{display:block;background:var(--neg-bg);color:var(--neg)}
  .msg.ok{display:block;background:var(--pos-bg);color:var(--pos)}
</style>
</head>
<body>
<div class="card">
  <h1>Change your password</h1>
  <p class="lead" id="lead">Choose a new password to continue.</p>
  <form id="form">
    <label for="current">Current password</label>
    <input type="password" id="current" autocomplete="current-password" required>
    <label for="next">New password</label>
    <input type="password" id="next" autocomplete="new-password" required>
    <label for="confirm">Confirm new password</label>
    <input type="password" id="confirm" autocomplete="new-password" required>
    <button type="submit" id="submitBtn">Set new password</button>
  </form>
  <div id="msg" class="msg"></div>
</div>
<script>
(function () {
  "use strict";
  var params = new URLSearchParams(location.search);
  var redirect = params.get("redirect") || "/landing";

  fetch("/api/me", { cache: "no-store" }).then(function (r) {
    if (r.status === 401) { window.location.href = "/login?redirect=" + encodeURIComponent(location.pathname + location.search); return null; }
    return r.json();
  }).then(function (me) {
    if (!me) return;
    if (!me.mustChangePassword) document.getElementById("lead").textContent = "Signed in as " + me.upn + ".";
  });

  var form = document.getElementById("form");
  var msg = document.getElementById("msg");
  var submitBtn = document.getElementById("submitBtn");

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var next = document.getElementById("next").value;
    var confirm = document.getElementById("confirm").value;
    msg.className = "msg";
    if (next !== confirm) { msg.className = "msg err"; msg.textContent = "New passwords do not match."; return; }

    submitBtn.disabled = true;
    fetch("/api/change-password", {
      method: "POST", cache: "no-store", headers: { "content-type": "application/json" },
      body: JSON.stringify({ currentPassword: document.getElementById("current").value, newPassword: next }),
    })
      .then(function (r) { return r.text().then(function (t) { return { ok: r.ok, body: t ? JSON.parse(t) : {} }; }); })
      .then(function (res) {
        if (!res.ok) {
          msg.className = "msg err";
          msg.textContent = res.body.error || "Could not change password.";
          submitBtn.disabled = false;
          return;
        }
        msg.className = "msg ok";
        msg.textContent = "Password updated. Redirecting…";
        setTimeout(function () { window.location.href = redirect; }, 900);
      })
      .catch(function () {
        msg.className = "msg err";
        msg.textContent = "Could not reach the server. Try again.";
        submitBtn.disabled = false;
      });
  });
})();
</script>
</body>
</html>
