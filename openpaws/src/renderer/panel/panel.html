<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob: paws-asset:; media-src 'self' data: blob: paws-asset:; connect-src 'self' data: blob: paws-asset:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>OpenPaws</title>
<link rel="stylesheet" href="../shared/ui.css">
<link rel="stylesheet" href="panel.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="logo">🐾</span><div><b>OpenPaws</b><div class="small muted" id="treats">🍪 0 treats</div></div></div>
    <nav id="nav">
      <button data-tab="home"><span>🏠</span>Home</button>
      <button data-tab="pets"><span>🐈</span>My cats</button>
      <button data-tab="adopt"><span>💝</span>Adopt</button>
      <button data-tab="create"><span>📸</span>Photo cat</button>
      <button data-tab="reminders"><span>⏰</span>Reminders</button>
      <button data-tab="focus"><span>🎯</span>Focus &amp; wellness</button>
      <button data-tab="integrations"><span>🔗</span>Connections</button>
      <button data-tab="memory"><span>🧠</span>Memory</button>
      <button data-tab="achievements"><span>🏆</span>Achievements</button>
      <button data-tab="settings"><span>⚙️</span>Settings</button>
    </nav>
    <div class="side-cats" id="sideCats"></div>
    <div class="side-foot">
      <button class="btn small ghost" id="hideBtn">🙈 Hide cats</button>
      <button class="btn small ghost" id="chatBtn">💬 Chat</button>
    </div>
  </aside>
  <main id="main"></main>
</div>
<div class="toast-area" id="toasts"></div>
<script src="../shared/bridge.js"></script>
<script src="../shared/species.js"></script>
<script src="../shared/engine.js"></script>
<script src="../shared/draw.js"></script>
<script src="../shared/sprites.js"></script>
<script src="../shared/sound.js"></script>
<script src="../shared/photo.js"></script>
<script src="../shared/preview.js"></script>
<script src="panel.js"></script>
<script src="creator.js"></script>
</body>
</html>
