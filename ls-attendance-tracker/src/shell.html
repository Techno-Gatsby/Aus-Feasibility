<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attendance Tracker</title>
<style>
/*STYLE*/
</style>
</head>
<body>
<header id="topbar">
  <div class="hrow">
    <div class="brand">Latinem Securities<small>Attendance &amp; Billing</small></div>
    <span class="spacer"></span>
    <span id="savestate"></span>
    <label class="hbtn solid" title="Import a master attendance or client timesheet workbook">⬆ Import Excel<input type="file" id="hdr-import" accept=".xlsx,.xlsm,.xls" hidden></label>
    <button class="hbtn" id="hdr-backup" title="Download a backup copy of all data">Backup</button>
  </div>
  <nav id="tabs">
    <button data-view="attendance" class="on"><span class="n">1</span>Attendance</button>
    <button data-view="timesheets"><span class="n">2</span>Client timesheets</button>
    <button data-view="invoices"><span class="n">3</span>Invoice</button>
    <span class="sep"></span>
    <button data-view="employees">Employees</button>
    <button data-view="projects">Projects &amp; sites</button>
    <button data-view="data">Settings</button>
  </nav>
</header>
<main>
  <section id="v-attendance" class="view on"></section>
  <section id="v-timesheets" class="view"></section>
  <section id="v-invoices" class="view"></section>
  <section id="v-employees" class="view"></section>
  <section id="v-projects" class="view"></section>
  <section id="v-data" class="view"></section>
</main>
<div id="modal-bg"><div id="modal"></div></div>
<div id="toast"></div>
<div id="print-root"></div>
<script>
/*SCRIPT*/
</script>
</body>
</html>
