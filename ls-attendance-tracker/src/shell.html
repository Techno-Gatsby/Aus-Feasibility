<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attendance Tracker</title>
<style>
/*STYLE*/
</style>
</head>
<body>
<div class="app">
  <div class="menubar">
    <span class="brand"><span class="mark">LS</span>Attendance Tracker <small>Latinem Securities</small></span>
    <button class="menu" data-menu="file">File</button>
    <button class="menu" data-menu="help">Help</button>
    <span class="spacer"></span>
    <span id="savestate"></span>
    <span id="me-box" class="me-box"></span>
    <button class="tour-btn" id="tour-btn" title="Tour this page" aria-label="Tour this page">?</button>
    <button class="tour-btn ico" id="set-btn" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.5 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5ZM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z"/></svg></button>
  </div>
  <div class="toolbar" id="toolbar"></div>
  <div class="body" id="body">
    <nav class="rail" id="rail">
      <div class="railhead"><span title="Clients · Projects · Sites">Projects &amp; sites</span><span class="muted" id="railcount"></span></div>
      <input type="search" id="tree-q" placeholder="Find project or site">
      <ul class="tree" id="tree"></ul>
    </nav>
    <main class="workspace">
      <div class="doctabs" id="tabs" role="tablist">
        <button role="tab" class="doctab fo" data-view="live" data-group="live app">Today <span class="n" id="app-badge"></span></button>
        <button role="tab" class="doctab fo" data-view="insights">Insights</button>
        <span class="gap" role="presentation"></span>
        <button role="tab" class="doctab" data-view="employees">Security Personnel</button>
        <button role="tab" class="doctab" data-view="projects">Projects &amp; sites</button>
        <span class="gsep"></span>
        <button role="tab" class="doctab" data-view="attendance">Attendance</button>
        <button role="tab" class="doctab" data-view="timesheets" data-group="timesheets invoices tracker">Billing</button>
        <button role="tab" class="doctab" data-view="payroll" data-group="payroll reports">Payroll</button>
      </div>
      <div class="subtabs" id="subtabs"></div>
      <div class="docarea">
        <section id="v-attendance" class="doc view on"></section>
        <section id="v-timesheets" class="doc view"></section>
        <section id="v-live" class="doc view"></section>
        <section id="v-insights" class="doc view"></section>
        <section id="v-invoices" class="doc view"></section>
        <section id="v-tracker" class="doc view"></section>
        <section id="v-payroll" class="doc view"></section>
        <section id="v-reports" class="doc view"></section>
        <section id="v-employees" class="doc view"></section>
        <section id="v-projects" class="doc view"></section>
        <section id="v-app" class="doc view"></section>
        <section id="v-data" class="doc view"></section>
      </div>
    </main>
  </div>
  <div class="statusbar"><span id="status">Ready</span><span class="spacer"></span><span id="status2"></span></div>
</div>
<input type="file" id="hdr-import" accept=".xlsx,.xlsm,.xls" hidden>
<div class="dropdown" id="dropdown" hidden></div>
<div id="modal-bg"><div id="modal"></div></div>
<div class="toast" id="toast" role="status"></div>
<div id="topload" aria-hidden="true"></div>
<button class="ai-fab" id="ai-fab" title="Assistant" aria-label="Assistant"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M12 3C6.9 3 3 6.5 3 10.8c0 2.3 1.1 4.3 2.9 5.8L5 21l4.3-2.4c.9.2 1.8.3 2.7.3 5.1 0 9-3.5 9-7.9S17.1 3 12 3Zm-4 9.2a1.3 1.3 0 1 1 0-2.6 1.3 1.3 0 0 1 0 2.6Zm4 0a1.3 1.3 0 1 1 0-2.6 1.3 1.3 0 0 1 0 2.6Zm4 0a1.3 1.3 0 1 1 0-2.6 1.3 1.3 0 0 1 0 2.6Z"/></svg></button>
<div id="print-root"></div>
<script>
'use strict';
/*SCRIPT*/
</script>
</body>
</html>
