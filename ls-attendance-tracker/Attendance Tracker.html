<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attendance Tracker</title>
<style>
/* Design language follows Australia_Land_Feasibility_.html: navy masthead, white surfaces, Inter + mono numbers */
:root{
  --ink:#16202F; --ink2:#12305E; --accent:#1766CB; --accent-soft:#EDF1F7;
  --canvas:#F4F6FA; --surface:#FFFFFF; --raised:#FBFCFE;
  --line:#E4E9F1; --line2:#C9D2E1; --line3:#A9B6CC;
  --text:#16202F; --text2:#42506B; --mute:#6B7A94; --faint:#93A0B5;
  --pos:#2B6A52; --pos-bg:#ECF5EF; --neg:#8F3C3C; --neg-bg:#FAEEEE; --warn:#7A6740; --warn-bg:#F8F1E6; --info-bg:#EAF2FD;
  --sans:"Inter","Aptos Narrow","Segoe UI Variable","Segoe UI",-apple-system,system-ui,sans-serif;
  --mono:"JetBrains Mono","Aptos Mono","SF Mono","Consolas",ui-monospace,monospace;
  --sh1:0 1px 2px rgba(15,30,61,.05); --sh2:0 1px 3px rgba(15,30,61,.06),0 4px 12px rgba(15,30,61,.05);
  --r:5px;
  /* legacy aliases used in view code */
  --brand:var(--ink2); --brand2:var(--accent); --muted:var(--mute); --ok:var(--pos); --bad:var(--neg); --sel:var(--accent);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--surface);color:var(--text);font:13px/1.5 var(--sans);-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
button,input,select,textarea{font-family:var(--sans);font-size:12.5px;color:inherit}
.num,td.num,th.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}

/* ── masthead + tabs ─────────────────────────── */
#topbar{position:sticky;top:0;z-index:50;background:var(--ink);color:#fff}
#topbar .hrow{display:flex;align-items:center;gap:12px;height:48px;padding:0 18px}
#topbar .brand{font:700 13px var(--sans);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
#topbar .brand small{font-weight:450;letter-spacing:.02em;text-transform:none;color:#A9B6CC;margin-left:8px;font-size:12px}
#topbar .spacer{flex:1}
.hbtn{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);color:#EDF1F7;padding:6px 12px;font:600 11px var(--sans);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;border-radius:var(--r);white-space:nowrap}
.hbtn:hover{background:rgba(255,255,255,.14);color:#fff}
.hbtn.solid{background:#fff;color:var(--ink);border-color:#fff;font-weight:650}
.hbtn.solid:hover{background:#E4E9F1}
#savestate{font:500 11px var(--sans);color:#A9B6CC;white-space:nowrap}
#savestate b{color:#8FD3AE;font-weight:600}
#tabs{display:flex;gap:2px;background:#fff;border-bottom:1px solid var(--line2);padding:0 12px;overflow-x:auto}
#tabs button{background:transparent;border:0;border-bottom:2px solid transparent;padding:11px 14px 10px;font:600 11px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);cursor:pointer;white-space:nowrap}
#tabs button:hover{color:var(--ink)}
#tabs button.on{color:var(--ink2);border-bottom-color:var(--accent);font-weight:700}
#tabs .n{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font:700 10px var(--mono);margin-right:6px}
#tabs button.on .n{background:var(--accent);color:#fff}
#tabs .sep{width:1px;background:var(--line);margin:8px 8px}

main{padding:18px 20px 60px}
.view{display:none;max-width:1680px}
.view.on{display:block}

/* ── page header, KPIs ─────────────────────────── */
.ph-row{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:0 0 14px}
h2.ph{margin:0;font-size:19px;font-weight:680;color:var(--ink);letter-spacing:-.02em}
p.pd{margin:2px 0 0;font-size:13px;color:var(--mute)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 14px}
.kpi{border:1px solid var(--line);border-top:3px solid var(--c,var(--accent));border-radius:var(--r);background:#fff;padding:10px 12px;box-shadow:var(--sh1)}
.kpi .k{font:650 10px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.kpi .v{font:650 20px var(--mono);color:var(--ink);margin-top:2px}
.kpi .s{font-size:11px;color:var(--faint)}
.alert{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid #E8D3A8;background:var(--warn-bg);color:var(--warn);border-radius:var(--r);padding:8px 12px;margin:0 0 14px;font-size:12.5px}
.alert.info{border-color:var(--line2);background:var(--info-bg);color:var(--ink2)}

/* ── shell with left rail ─────────────────────────── */
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);gap:18px;align-items:start}
.rail{position:sticky;top:110px;border:1px solid var(--line);border-radius:var(--r);background:#fff;max-height:calc(100vh - 128px);overflow:auto}
.fs{border-bottom:1px solid var(--line)}
.fs:last-child{border-bottom:0}
.lg{padding:9px 14px;font:650 10.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);background:var(--raised);border-bottom:1px solid var(--line)}
.grp{padding:10px 14px 12px;display:flex;flex-direction:column;gap:7px}
.grp select,.grp input[type=search],.grp input[type=month]{width:100%}
.grp .pair{display:grid;grid-template-columns:auto 1fr auto;gap:5px}
.codes{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.codes button{border:1px solid var(--line2);border-radius:var(--r);padding:5px 2px 3px;cursor:pointer;font:700 12px var(--mono);line-height:1.1}
.codes button small{display:block;font:500 9.5px var(--sans);color:var(--text2);letter-spacing:0;margin-top:1px}
.codes button:hover{border-color:var(--ink2)}
.codes button kbd{font:600 8.5px var(--mono);color:var(--faint)}
@media (max-width:1000px){.shell{grid-template-columns:1fr}.rail{position:static;max-height:none}}

/* ── generic ─────────────────────────── */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh1);padding:14px 16px;margin-bottom:14px}
.card h2{font-size:14px;font-weight:680;margin:0 0 10px;color:var(--ink)}
.card h3{font:650 10.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;margin:16px 0 8px;color:var(--accent)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.grow{flex:1}
.muted{color:var(--mute)}
.small{font-size:11.5px}
.hint{color:var(--mute);font-size:12px;margin:6px 0 0}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px 14px}
label.f{display:flex;flex-direction:column;gap:3px;font:600 10.5px var(--sans);letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}
label.f > input,label.f > select,label.f > textarea{text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink2);font-size:13px}
label.chk{display:inline-flex;gap:6px;align-items:center;cursor:pointer;font-size:12px;color:var(--text2)}
input[type=text],input[type=number],input[type=date],input[type=month],input[type=search],select,textarea{border:1px solid var(--line2);border-radius:var(--r);padding:5px 8px;background:#fff;min-height:30px;color:var(--ink2)}
input:hover,select:hover,textarea:hover{border-color:var(--line3)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px rgba(46,92,168,.12)}
textarea{min-height:60px;resize:vertical}
.btn{border:1px solid var(--line2);background:#fff;border-radius:var(--r);padding:6px 12px;cursor:pointer;min-height:30px;white-space:nowrap;font:600 11px var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--ink2)}
.btn:hover{border-color:var(--ink2);background:var(--raised)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:var(--ink2);border-color:var(--ink2)}
.btn.bad{color:var(--neg);border-color:#E6C4C4}
.btn.bad:hover{background:var(--neg-bg)}
.btn.sm{padding:3px 8px;min-height:24px;font-size:10px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.tag{display:inline-block;padding:1px 6px;border-radius:3px;background:var(--canvas);border:1px solid var(--line);font:650 9.5px var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--text2);vertical-align:1px}
.tag.warn{background:var(--warn-bg);color:var(--warn);border-color:#E8D3A8}
.tag.bad{background:var(--neg-bg);color:var(--neg);border-color:#E6C4C4}
.tag.ok{background:var(--pos-bg);color:var(--pos);border-color:#C5DFCF}
.empty{border:1px dashed var(--line2);border-radius:var(--r);padding:40px 20px;text-align:center;color:var(--mute);background:var(--raised)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.empty .row{justify-content:center;margin-top:14px}

table.t{border-collapse:collapse;width:100%;background:#fff}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:middle}
table.t th{background:var(--raised);font:650 10px var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--mute);position:sticky;top:0;z-index:1}
table.t tr:hover td{background:var(--raised)}
table.t td.num,table.t th.num{text-align:right}
table.t input,table.t select{min-height:26px;padding:2px 6px}
.scroll{overflow:auto;max-height:calc(100vh - 260px);border:1px solid var(--line);border-radius:var(--r)}

/* ── attendance grid ─────────────────────────── */
#grid-wrap{overflow:auto;max-height:calc(100vh - 300px);border:1px solid var(--line);border-radius:var(--r);background:#fff;user-select:none}
table.ag{border-collapse:separate;border-spacing:0;font-size:11.5px}
table.ag th,table.ag td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0 5px;height:25px;white-space:nowrap}
table.ag thead th{position:sticky;top:0;background:var(--raised);z-index:3;font:650 9.5px var(--sans);letter-spacing:.05em;color:var(--mute);text-align:center;text-transform:uppercase}
table.ag thead tr:nth-child(2) th{top:25px;font:600 11px var(--mono);color:var(--ink2)}
table.ag thead th.we{background:#EEF2F8}
table.ag td.d{width:30px;min-width:30px;max-width:30px;text-align:center;cursor:cell;position:relative;font:650 10.5px var(--mono);padding:0}
table.ag td.d:hover{box-shadow:inset 0 0 0 1px var(--line3)}
table.ag td.d.lk{background:repeating-linear-gradient(45deg,#F6F7FA,#F6F7FA 4px,#EDF0F5 4px,#EDF0F5 8px);cursor:not-allowed}
table.ag td.d.frz{cursor:not-allowed;opacity:.75}
table.ag td.d.sel{outline:2px solid var(--accent);outline-offset:-2px;z-index:1}
table.ag td.d .ov{position:absolute;top:2px;right:2px;width:5px;height:5px;border-radius:50%;background:#7c3aed}
table.ag td.d .nt{position:absolute;bottom:0;left:2px;font-size:7px;color:var(--accent)}
table.ag .fix{position:sticky;background:#fff;z-index:2}
table.ag thead .fix{z-index:4;background:var(--raised)}
table.ag td.nm{cursor:pointer;color:var(--ink2);font-weight:600;max-width:220px;overflow:hidden;text-overflow:ellipsis}
table.ag td.nm:hover{color:var(--accent)}
table.ag td.tot{text-align:right;font:700 11.5px var(--mono);padding:0 7px}
table.ag td.sum{font-size:10.5px;color:var(--mute)}
table.ag tr.left td.nm{color:var(--faint);text-decoration:line-through}
table.ag tfoot td{position:sticky;bottom:0;background:var(--raised);font:700 10.5px var(--mono);text-align:center;z-index:2;color:var(--ink2)}
table.ag tfoot td.fix{z-index:4;font-family:var(--sans)}

/* ── modal / toast ─────────────────────────── */
#modal-bg{position:fixed;inset:0;background:rgba(22,32,47,.45);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:48px 16px;overflow:auto}
#modal-bg.on{display:flex}
#modal{background:#fff;border-radius:8px;box-shadow:0 20px 50px rgba(0,0,0,.25);width:min(820px,100%)}
#modal .mh{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
#modal .mh h3{margin:0;font-size:15px;font-weight:680;flex:1}
#modal .mb{padding:16px;max-height:calc(100vh - 210px);overflow:auto}
#modal .mf{padding:10px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;background:var(--raised);border-radius:0 0 8px 8px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:6px;z-index:200;display:none;max-width:90vw;font-size:12.5px}

/* ── timesheet & invoice sheets (screen + print) ─────────────────────────── */
.sheet{background:#fff;border:1px solid var(--line);box-shadow:var(--sh2);margin:0 auto 18px;padding:14px 16px;color:#000;font-family:Calibri,"Segoe UI",Arial,sans-serif}
.sheet.land{width:1120px;max-width:100%;overflow-x:auto}
.sheet.port{width:800px;max-width:100%}
.ts-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.ts-head .t1{font-size:18px;font-weight:700;letter-spacing:.5px}
.ts-head .t2{font-size:13px;font-weight:700;margin-top:2px}
.ts-head .t3{font-size:10.5px;margin-top:4px}
.ts-legend{border-collapse:collapse;font-size:10px}
.ts-legend td{border:1px solid #000;padding:1px 6px}
.ts-meta{margin:8px 0 6px;font-size:11.5px}
.ts-meta b{display:inline-block;min-width:95px}
table.ts{border-collapse:collapse;width:100%;font-size:9.5px}
table.ts th,table.ts td{border:1px solid #000;padding:1px 2px;text-align:center;height:16px}
table.ts th{background:#d9e1f2;font-weight:700}
table.ts td.l{text-align:left;padding-left:4px}
table.ts td.site{font-weight:700;text-align:left;vertical-align:middle;padding-left:4px;max-width:140px;white-space:normal}
table.ts td.tot,table.ts td.gt{font-weight:700}
table.ts tr.gtr td{background:#f2f2f2}
.ts-sign{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:22px;font-size:9.5px}
.ts-sign div b{display:block;margin-bottom:26px}
.inv{font-size:12px}
.inv .ihead{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid var(--ink2);padding-bottom:8px}
.inv .logo{font-size:24px;font-weight:800;color:var(--ink2);letter-spacing:1px}
.inv .ttl{text-align:center;font-size:17px;font-weight:700;margin:12px 0;letter-spacing:1px}
.inv .blocks{display:flex;justify-content:space-between;gap:20px;margin-bottom:12px}
.inv .blocks .addr{white-space:pre-line;line-height:1.45}
.inv table.kv{border-collapse:collapse}
.inv table.kv td{border:1px solid #999;padding:3px 8px}
.inv table.kv td:first-child{background:#f2f4f7;font-weight:600;white-space:nowrap}
.inv table.lines{border-collapse:collapse;width:100%;margin-top:6px}
.inv table.lines th,.inv table.lines td{border:1px solid #999;padding:4px 6px}
.inv table.lines th{background:#12305E;color:#fff;font-weight:600}
.inv table.lines td.num{text-align:right}
.inv table.lines tr.tt td{font-weight:700;background:#f2f4f7}
.inv .words{margin-top:10px;font-style:italic}
.inv .foot{margin-top:40px;display:flex;justify-content:space-between;font-size:11px}
#print-root{display:none}
@page land{size:A4 landscape;margin:7mm}
@page port{size:A4 portrait;margin:12mm}
@media print{
  body{background:#fff}
  body.printing #topbar,body.printing main,body.printing #modal-bg,body.printing #toast{display:none!important}
  body.printing #print-root{display:block}
  #print-root .sheet{border:0;box-shadow:none;margin:0;padding:0;width:auto;overflow:visible;break-after:page}
  #print-root .sheet:last-child{break-after:auto}
  #print-root .sheet.land{page:land}
  #print-root .sheet.port{page:port}
  table.ts th,.inv table.lines th,.inv table.kv td,.inv table.lines tr.tt td{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

.step{display:flex;align-items:center;gap:9px;font:680 14px var(--sans);color:var(--ink);margin:0 0 12px}
.step span{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font:700 11px var(--mono)}
.step small{font:500 12px var(--sans);color:var(--mute)}
#iv-preview .sheet{margin:0 0 14px;border-radius:0 0 5px 5px}
table.t tbody tr.on td{background:var(--info-bg)}

</style>
</head>
<body>
<header id="topbar">
  <div class="hrow">
    <div class="brand">Latinem Securities<small>Attendance &amp; Billing</small></div>
    <span class="spacer"></span>
    <span id="savestate"></span>
    <label class="hbtn solid" title="Import a master attendance or client timesheet workbook">⬆ Import Excel<input type="file" id="hdr-import" accept=".xlsx,.xlsm,.xls" hidden></label>
    <button class="hbtn" id="hdr-backup" title="Download a backup copy of all data">Backup</button>
  </div>
  <nav id="tabs">
    <button data-view="attendance" class="on"><span class="n">1</span>Attendance</button>
    <button data-view="timesheets"><span class="n">2</span>Client timesheets</button>
    <button data-view="invoices"><span class="n">3</span>Invoice</button>
    <span class="sep"></span>
    <button data-view="employees">Employees</button>
    <button data-view="projects">Projects &amp; sites</button>
    <button data-view="data">Settings</button>
  </nav>
</header>
<main>
  <section id="v-attendance" class="view on"></section>
  <section id="v-timesheets" class="view"></section>
  <section id="v-invoices" class="view"></section>
  <section id="v-employees" class="view"></section>
  <section id="v-projects" class="view"></section>
  <section id="v-data" class="view"></section>
</main>
<div id="modal-bg"><div id="modal"></div></div>
<div id="toast"></div>
<div id="print-root"></div>
<script>
'use strict';
/* =====================================================================
   LS Attendance Tracker - core: utilities, dates, state, persistence
   ===================================================================== */

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = p => p + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
const norm = s => String(s ?? '').trim().replace(/\s+/g, ' ').toUpperCase();
const pad = n => String(n).padStart(2, '0');
const round2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const money = n => (Number(n) || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const qtyFmt = n => (Math.round(n * 100) / 100).toLocaleString('en-US', { maximumFractionDigits: 2 });

/* ---------- dates (ISO 'YYYY-MM-DD', computed in UTC to avoid DST/timezone drift) ---------- */
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MONTH_FULL = ['JANUARY', 'FEBRUARY', 'MARCH', 'APRIL', 'MAY', 'JUNE', 'JULY', 'AUGUST', 'SEPTEMBER', 'OCTOBER', 'NOVEMBER', 'DECEMBER'];
const WD = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
const toDate = iso => { const [y, m, d] = iso.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); };
const isoOf = dt => `${dt.getUTCFullYear()}-${pad(dt.getUTCMonth() + 1)}-${pad(dt.getUTCDate())}`;
const addDays = (iso, n) => { const d = toDate(iso); d.setUTCDate(d.getUTCDate() + n); return isoOf(d); };
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const dim = ym => { const [y, m] = ym.split('-').map(Number); return new Date(Date.UTC(y, m, 0)).getUTCDate(); };
const addMonths = (ym, n) => { let [y, m] = ym.split('-').map(Number); m += n; while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; } return `${y}-${pad(m)}`; };
const ymOf = iso => iso.slice(0, 7);
const weekday = iso => toDate(iso).getUTCDay();
const fmtDMY = iso => iso ? `${iso.slice(8, 10)}/${iso.slice(5, 7)}/${iso.slice(0, 4)}` : '';
const fmtDotDMY = iso => iso ? `${iso.slice(8, 10)}.${iso.slice(5, 7)}.${iso.slice(0, 4)}` : '';
const fmtMonYY = ym => `${MON[+ym.slice(5, 7) - 1]}-${ym.slice(2, 4)}`;
const fmtMonthName = ym => `${MONTH_FULL[+ym.slice(5, 7) - 1]}-${ym.slice(0, 4)}`;
function datesBetween(a, b) { const out = []; for (let d = a; d <= b; d = addDays(d, 1)) out.push(d); return out; }
function monthDates(ym) { return datesBetween(ym + '-01', `${ym}-${pad(dim(ym))}`); }
function monthsBetween(a, b) { const out = []; for (let m = a; m <= b; m = addMonths(m, 1)) out.push(m); return out; }

/** Payroll cycle named after the month it ends in, e.g. 2026-07 => 21/06/2026 - 20/07/2026 */
function payrollCycle(ym) {
  const sd = +S.settings.cycleStartDay || 1;
  if (sd <= 1) return { start: ym + '-01', end: `${ym}-${pad(dim(ym))}` };
  const prev = addMonths(ym, -1);
  const start = `${prev}-${pad(Math.min(sd, dim(prev)))}`;
  const end = addDays(`${ym}-${pad(Math.min(sd, dim(ym)))}`, -1);
  return { start, end };
}
function cycleOfDate(iso) {
  const sd = +S.settings.cycleStartDay || 1;
  if (sd <= 1) return ymOf(iso);
  return (+iso.slice(8, 10) >= sd) ? addMonths(ymOf(iso), 1) : ymOf(iso);
}

/** Parse the many date shapes found in the Excel sheets. Returns ISO or null. */
function parseAnyDate(v) {
  if (v == null || v === '') return null;
  if (v instanceof Date && !isNaN(v)) return `${v.getFullYear()}-${pad(v.getMonth() + 1)}-${pad(v.getDate())}`;
  if (typeof v === 'number') {
    if (v < 20000 || v > 80000) return null;                  // Excel serial window ~1954-2119
    return isoOf(new Date(Math.round((v - 25569) * 86400000)));
  }
  const s = String(v).trim();
  let m;
  if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  if ((m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/))) {
    let a = +m[1], b = +m[2], y = +m[3]; if (y < 100) y += 2000;
    let mo = a, d = b;                              // the master sheet shows M/D/YYYY
    if (a > 12) { d = a; mo = b; }                  // unambiguous D/M/Y
    if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
    return `${y}-${pad(mo)}-${pad(d)}`;
  }
  return null;
}
/** 'Jun-26', 'June 2026', 'JUN 2026', Excel serial, Date -> 'YYYY-MM' */
function parseAnyMonth(v) {
  const iso = parseAnyDate(v); if (iso) return ymOf(iso);
  const s = norm(v); const m = s.match(/^([A-Z]{3,9})[\s\-']*(\d{2,4})$/);
  if (!m) return null;
  const mi = MON.findIndex(x => m[1].startsWith(x.toUpperCase()));
  if (mi < 0) return null;
  let y = +m[2]; if (y < 100) y += 2000;
  return `${y}-${pad(mi + 1)}`;
}

function migrate(st) {
  const d = defaultState();
  st.settings = Object.assign({}, d.settings, st.settings || {});
  for (const k of ['codes', 'clients', 'projects', 'sites', 'employees', 'invoices']) if (!Array.isArray(st[k])) st[k] = d[k];
  st.att = st.att || {}; st.locks = st.locks || {};
  st.settings.rateCard ||= d.settings.rateCard;
  for (const c of d.codes) if (!st.codes.some(x => x.code === c.code)) st.codes.push({ ...c, key: st.codes.some(x => x.key === c.key) ? '' : c.key });
  for (const e of st.employees) { e.assign = (e.assign || []).sort((a, b) => a.from < b.from ? -1 : 1); }
  st.version = 1;

/* ---------- attendance helpers ---------- */
function getCell(empId, d) { const v = S.att[empId]?.[d]; if (!v) return null; return typeof v === 'string' ? { c: v } : v; }
function putCell(empId, d, val) {
  if (!val || !val.c) { if (S.att[empId]) { delete S.att[empId][d]; } return; }
  (S.att[empId] ||= {});
  S.att[empId][d] = (val.s || val.sh) ? { c: val.c, ...(val.s ? { s: val.s } : {}), ...(val.sh ? { sh: val.sh } : {}) } : val.c;
}
function assignOn(emp, d) { let a = null; for (const x of emp.assign || []) { if (x.from <= d) a = x; else break; } return a; }
function siteOn(emp, d) { const c = getCell(emp.id, d); return c?.s || assignOn(emp, d)?.site || null; }
function shiftOn(emp, d) { const c = getCell(emp.id, d); return c?.sh || assignOn(emp, d)?.shift || emp.shift || ''; }
function employedOn(emp, d) { return (!emp.doj || d >= emp.doj) && (!emp.end || d <= emp.end); }
function isLocked(d) { return !!S.locks[cycleOfDate(d)]; }
function codeDef(c) { return IX.code.get(c) || { code: c, label: c, color: '#f2f4f7', billable: false, client: false }; }
/** Monthly rate for a trade on a project: project override → rate card → project default rate */
function rateFor(p, trade) {
  const o = p?.billing?.rates?.[trade]; if (o) return +o;
  const rc = S.settings.rateCard.find(r => r.trade === trade); if (rc?.rate) return +rc.rate;
  return +p?.billing?.rate || 0;
}
const unitFor = trade => S.settings.rateCard.find(r => r.trade === trade)?.unit || (trade === 'SECURITY GUARD' || !trade ? 'Security' : trade.replace(/\b\w+/g, w => /^(CCTV|ERT|LFM)$/.test(w) ? w : w[0] + w.slice(1).toLowerCase()));
function empCodeLabel(e) { return e.empCode || (e.agency ? `SUBCON (${e.agency})` : ''); }
function siteName(id) { return IX.site.get(id)?.name || ''; }
function projOfSite(id) { const s = IX.site.get(id); return s ? IX.proj.get(s.projectId) || null : null; }
function sitesOfProject(pid) { return S.sites.filter(s => s.projectId === pid); }
function setAssignment(emp, from, site, shift) {
  emp.assign = (emp.assign || []).filter(a => a.from !== from);
  emp.assign.push({ from, site, shift: shift || emp.shift || '' });
  emp.assign.sort((a, b) => a.from < b.from ? -1 : 1);
  // collapse consecutive identical entries
  emp.assign = emp.assign.filter((a, i, arr) => i === 0 || a.site !== arr[i - 1].site || a.shift !== arr[i - 1].shift);
}

function computeAttRows() {
  const { start, end } = attPeriod();
  AV.dates = datesBetween(start, end);
  const f = AV.f, q = norm(f.q);
  const out = [];
  for (const e of S.employees) {
    if (f.status === 'active' && !((!e.doj || e.doj <= end) && (!e.end || e.end >= start))) continue;
    if (f.status === 'left' && !(e.end && e.end <= end)) continue;
    if (f.type === 'ls' && e.agency) continue;
    if (f.type === 'sub' && !e.agency) continue;
    if (f.trade && e.trade !== f.trade) continue;
    if (q && !norm(e.name).includes(q) && !norm(e.empCode).includes(q)) continue;
    const sites = new Set(), shifts = new Set();
    let lastSite = null;
    for (const d of AV.dates) {
      if (!employedOn(e, d)) continue;
      const s = siteOn(e, d); if (s) { sites.add(s); lastSite = s; }
      shifts.add(shiftOn(e, d));
    }
    if (!sites.size) { const a = assignOn(e, end) || e.assign?.[0]; if (a?.site) { sites.add(a.site); lastSite = a.site; } }
    if (!shifts.size) shifts.add(e.shift || '');
    if (f.site && !sites.has(f.site)) continue;
    if (f.project && ![...sites].some(s => IX.site.get(s)?.projectId === f.project)) continue;
    if (f.client && ![...sites].some(s => projOfSite(s)?.clientId === f.client)) continue;
    if (f.shift && !shifts.has(f.shift)) continue;
    const mainShift = assignOn(e, end)?.shift || e.shift || [...shifts][0] || '';
    out.push({ emp: e, sites, lastSite, shift: mainShift });
  }
  const by = {
    name: (a, b) => a.emp.name.localeCompare(b.emp.name),
    site: (a, b) => siteName(a.lastSite).localeCompare(siteName(b.lastSite)) || a.shift.localeCompare(b.shift) || a.emp.name.localeCompare(b.emp.name),
    shift: (a, b) => a.shift.localeCompare(b.shift) || a.emp.name.localeCompare(b.emp.name),
    code: (a, b) => (a.emp.empCode || 'zz').localeCompare(b.emp.empCode || 'zz')
  }[AV.sort];
  if (by) out.sort(by);
  AV.rows = out;
}

function cellInner(emp, d) {
  if (!employedOn(emp, d)) return { cls: 'd lk', style: '', html: '', title: emp.doj && d < emp.doj ? 'Before joining date' : 'After end date' + (emp.endReason ? ' (' + emp.endReason + ')' : '') };
  const c = getCell(emp.id, d);
  const a = assignOn(emp, d);
  let cls = 'd' + (isLocked(d) ? ' frz' : ''), style = '', html = '', title = fmtDMY(d);
  if (c) {
    const cd = codeDef(c.c);
    style = `background:${cd.color}`; html = esc(c.c.length > 4 ? c.c.slice(0, 4) : c.c);
    title += ` · ${cd.label}`;
    if (c.s && c.s !== a?.site) { html += '<i class="ov"></i>'; }
    if (c.sh && c.sh !== (a?.shift || emp.shift)) html += `<i class="nt">${esc(c.sh[0])}</i>`;
  }
  const s = siteOn(emp, d); if (s) title += ` · ${siteName(s)}`;
  const sh = shiftOn(emp, d); if (sh) title += ` · ${sh}`;
  return { cls, style, html, title };
}

function rowHTML(i) {
  const { emp, lastSite, sites, shift } = AV.rows[i];

function setSel(a, b) { AV.sel = { r0: Math.min(a.r, b.r), r1: Math.max(a.r, b.r), c0: Math.min(a.c, b.c), c1: Math.max(a.c, b.c) }; paintSel(); }
function paintSel() {

function refreshRows(rowIdx) {

/** Apply a value to every selected cell. val = null clears; val = {c, s?, sh?} where s/sh undefined = keep, null = back to assigned */
function applyToSel(val, onlyEmpty = AV.onlyEmpty) {
  const s = AV.sel; if (!s) { toast('Select one or more cells first'); return; }
  const changes = []; const rowsTouched = new Set(); let skippedLock = 0;
  for (let r = s.r0; r <= s.r1; r++) {
    const emp = AV.rows[r].emp;
    for (let c = s.c0; c <= s.c1; c++) {
      const d = AV.dates[c];
      if (!employedOn(emp, d)) continue;
      if (isLocked(d)) { skippedLock++; continue; }
      const prev = S.att[emp.id]?.[d];
      if (onlyEmpty && prev) continue;
      let nv = null;
      if (val) {
        const cur = getCell(emp.id, d) || {};
        const a = assignOn(emp, d);
        nv = { c: val.c ?? cur.c, s: val.s === undefined ? cur.s : val.s, sh: val.sh === undefined ? cur.sh : val.sh };
        if (!nv.c) nv = null;
        else {
          if (!nv.s || nv.s === a?.site) delete nv.s;
          if (!nv.sh || nv.sh === (a?.shift || emp.shift)) delete nv.sh;
        }
      }
      changes.push({ e: emp.id, d, prev: prev === undefined ? null : (typeof prev === 'object' ? { ...prev } : prev) });
      putCell(emp.id, d, nv); rowsTouched.add(r);
    }
  }
  if (skippedLock) toast(`${skippedLock} cell(s) skipped – payroll month is locked`);
  else if (changes.length > 1) toast(val ? `Marked ${changes.length} days as ${val.c}` : `Cleared ${changes.length} days`);
  if (!changes.length) return;
  AV.undo.push(changes); if (AV.undo.length > 60) AV.undo.shift();
  markDirty(); refreshRows(rowsTouched);
}
function undoAtt() {
  const ch = AV.undo.pop(); if (!ch) { toast('Nothing to undo'); return; }
  for (const x of ch) { if (x.prev == null) { if (S.att[x.e]) delete S.att[x.e][x.d]; } else (S.att[x.e] ||= {})[x.d] = x.prev; }
  markDirty(); renderGrid(); toast(`Undid ${ch.length} cell change(s)`);
}
function openCellEditor() {
  const s = AV.sel; if (!s) { toast('Select one or more cells first'); return; }
  const n = (s.r1 - s.r0 + 1) * (s.c1 - s.c0 + 1);
  const one = n === 1 ? getCell(AV.rows[s.r0].emp.id, AV.dates[s.c0]) : null;
  openModal(`Set ${n} cell${n > 1 ? 's' : ''}`, `
    <div class="grid2">

      <label class="f">Shift<select id="ce-shift"><option value="__keep">Keep as is</option><option value="__def">Assigned shift (default)</option>${opts(S.settings.shifts, one?.sh)}</select></label>
    </div>
    <label class="chk" style="margin-top:10px"><input type="checkbox" id="ce-empty" ${AV.onlyEmpty ? 'checked' : ''}> Only fill empty cells</label>
    <p class="hint">Use this for relievers: select their days, choose <b>R</b> and the site they relieved at. The day is then billed on that site's client timesheet in the RELIEVER section.</p>`,
    [{ label: 'Cancel' }, {
      label: 'Apply', cls: 'pri', onClick: m => {
        const code = $('#ce-code', m).value, site = $('#ce-site', m).value, sh = $('#ce-shift', m).value;
        if (!code) { applyToSel(null, $('#ce-empty', m).checked); return; }
        applyToSel({ c: code, s: site === '__keep' ? undefined : site === '__def' ? null : site, sh: sh === '__keep' ? undefined : sh === '__def' ? null : sh }, $('#ce-empty', m).checked);
      }
    }]);
  if (one?.s) $('#ce-site').value = one.s;
  if (one?.sh) $('#ce-shift').value = one.sh;
}

document.addEventListener('keydown', e => {
  if (!$('#v-attendance').classList.contains('on') || $('#modal-bg').classList.contains('on')) return;
  if (e.target.matches('input,select,textarea')) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undoAtt(); return; }
  if (!AV.sel) return;
  const mv = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] }[e.key];
  if (mv) {
    e.preventDefault();
    const cur = e.shiftKey ? { r: AV.sel.r0 === AV.anchor.r ? AV.sel.r1 : AV.sel.r0, c: AV.sel.c0 === AV.anchor.c ? AV.sel.c1 : AV.sel.c0 } : { ...AV.anchor };
    const nx = { r: Math.max(0, Math.min(AV.rows.length - 1, cur.r + mv[0])), c: Math.max(0, Math.min(AV.dates.length - 1, cur.c + mv[1])) };
    if (e.shiftKey) setSel(AV.anchor, nx); else { AV.anchor = nx; setSel(nx, nx); }
    const td = $$('#grid-wrap tbody tr')[nx.r]?.querySelectorAll('td.d')[nx.c]; td?.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    return;
  }
  if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); applyToSel(null, false); return; }
  if (e.key === 'Enter') { e.preventDefault(); openCellEditor(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey || e.key.length !== 1) return;
  const cd = S.codes.find(c => c.key && c.key.toLowerCase() === e.key.toLowerCase());
  if (cd) {
    e.preventDefault(); applyToSel({ c: cd.code });
    // single-cell entry: advance to the next day for fast typing
    const s = AV.sel;
    if (s.r0 === s.r1 && s.c0 === s.c1 && s.c1 < AV.dates.length - 1) { AV.anchor = { r: s.r0, c: s.c0 + 1 }; setSel(AV.anchor, AV.anchor); }
  }
});

async function bulkDelete() {

        reindex(); markDirty(); renderAll();
      }

function countSiteRefs(id) {
  let n = 0;
  for (const e of S.employees) for (const a of e.assign || []) if (a.site === id) n++;
  for (const k in S.att) for (const d in S.att[k]) { const v = S.att[k][d]; if (typeof v === 'object' && v.s === id) n++; }
  return n;
}
function mergeSite(from, to) {
  for (const e of S.employees) {
    if (!e.assign?.length) continue;
    for (const a of e.assign) if (a.site === from) a.site = to;
    e.assign = e.assign.filter((a, i, arr) => i === 0 || a.site !== arr[i - 1].site || a.shift !== arr[i - 1].shift);
  }
  for (const k in S.att) for (const d in S.att[k]) { const v = S.att[k][d]; if (typeof v === 'object' && v.s === from) v.s = to; }
  S.sites = S.sites.filter(x => x.id !== from); reindex(); markDirty(); renderAll(); toast('Sites merged');
}

/* =====================================================================
   Client timesheets (calendar month, one sheet per project, LS/DO/F-026)
   ===================================================================== */
const TS_LEGEND = [['P', 'PRESENT'], ['A', 'ABSENT'], ['O', 'DAY OFF'], ['R', 'RELIEVER']];
const TV = { ym: null, client: '', picked: new Set(), all: true };

/** Build the project-wise breakup for one calendar month from the daily ledger. */
function buildTimesheet(projectId, ym) {
  const days = monthDates(ym);
  const siteOrder = sitesOfProject(projectId).map(s => s.id);
  const siteSet = new Set(siteOrder);
  const rows = new Map();
  S.employees.forEach((emp, ei) => {
    for (const d of days) {
      if (!employedOn(emp, d)) continue;
      const c = getCell(emp.id, d); if (!c) continue;
      const cd = codeDef(c.c); if (!cd.billable && !cd.client) continue;
      const site = siteOn(emp, d); if (!siteSet.has(site)) continue;
      const rel = c.c === 'R';
      const shift = shiftOn(emp, d) || '';
      const section = rel ? '__REL' : site;
      const key = `${section}|${shift}|${emp.id}`;
      let row = rows.get(key);
      if (!row) rows.set(key, row = { section, shift, emp, ei, cells: {}, total: 0, sites: new Set() });
      row.cells[+d.slice(8)] = c.c; row.sites.add(site);
      if (cd.billable) row.total++;
    }
  });
  const secIdx = s => s === '__REL' ? 1e6 : siteOrder.indexOf(s);
  const list = [...rows.values()].sort((a, b) => secIdx(a.section) - secIdx(b.section) || a.ei - b.ei || a.shift.localeCompare(b.shift));
  const sections = [];
  for (const r of list) {
    let sec = sections[sections.length - 1];
    if (!sec || sec.id !== r.section) sections.push(sec = { id: r.section, name: r.section === '__REL' ? 'RELIEVER' : siteName(r.section), rows: [] });
    sec.rows.push(r);
  }
  const total = list.reduce((a, r) => a + r.total, 0);
  // headcount equivalent per site = billable man-days / days in month
  return { projectId, ym, days: days.length, sections, total, rows: list };
}

function newInvoiceDraft() {
  const m = addMonths(ymOf(todayISO()), -1);
  return { id: uid('i'), no: '', date: todayISO(), clientId: '', projectIds: [], from: m, to: m, entity: '', trn: '', customerCode: '', poNo: '', lines: [], attachTs: true, notes: '' };
}

function invoiceLines(dr) {
  const lines = [];
  const multi = dr.projectIds.length > 1;
  for (const m of monthsBetween(dr.from, dr.to)) {
    for (const pid of dr.projectIds) {
      const p = IX.proj.get(pid); if (!p) continue;
      const b = p.billing || {}; const rate = +b.rate || 0; const unit = b.unit || 'Security';
      const ts = buildTimesheet(pid, m), md = ts.total, D = dim(m);
      if (!md && b.basis !== 'fixed') continue;           // nothing worked on this project that month
      if (!b.basis || b.basis === 'ratecard') {
        // Same shape as Latinem invoices: "22 Security @ 31 Days", "1 Security @ 5 Days" – rate × days ÷ days in month
        const perEmp = new Map();
        for (const r of ts.rows) perEmp.set(r.emp.id, { emp: r.emp, d: (perEmp.get(r.emp.id)?.d || 0) + r.total });
        const groups = new Map();
        for (const { emp, d } of perEmp.values()) { if (!d) continue; const k = `${emp.trade || 'SECURITY GUARD'}|${d}`; groups.set(k, (groups.get(k) || 0) + 1); }
        [...groups.entries()].sort((x, y) => x[0].split('|')[0].localeCompare(y[0].split('|')[0]) || +y[0].split('|')[1] - +x[0].split('|')[1]).forEach(([k, n]) => {
          const [trade, d] = k.split('|'); const rt = rateFor(p, trade);
          lines.push({ desc: (multi ? p.name + ' – ' : '') + `${fmtMonYY(m)}  ${n} ${unitFor(trade)} @ ${d} Days`, rate: rt, amount: round2(n * rt * +d / D), vat: +b.vat || 0, src: { pid, m, md: n * +d }, noRate: !rt });
        });
        continue;
      }
      let amt = 0, desc = '';
      switch (b.basis) {
        case 'monthly_26': case 'monthly_30': { const div = b.basis === 'monthly_26' ? 26 : 30; amt = md * rate / div; desc = `${fmtMonYY(m)}  ${md} man-days (${unit}) @ ${money(rate)} / ${div}`; break; }
        case 'daily': amt = md * rate; desc = `${fmtMonYY(m)}  ${md} man-days (${unit})`; break;
        case 'hourly': { const h = +S.settings.shiftHours || 12; amt = md * h * rate; desc = `${fmtMonYY(m)}  ${md} shifts × ${h} hrs = ${md * h} hrs (${unit})`; break; }
        case 'fixed': { const q = +b.posts || 0; amt = q * rate; desc = `${fmtMonYY(m)}  ${q} ${unit} @ ${D} Days`; break; }
        default: { const q = md / D; amt = md * rate / D; desc = `${fmtMonYY(m)}  ${qtyFmt(q)} ${unit} @ ${D} Days`; }
      }
      lines.push({ desc: (multi ? p.name + ' – ' : '') + desc, rate, amount: round2(amt), vat: +b.vat || 0, src: { pid, m, md } });
    }
  }
  return lines;
}
function invTotals(dr) {
  let ex = 0, vat = 0;
  for (const l of dr.lines) { ex += +l.amount || 0; vat += round2((+l.amount || 0) * (+l.vat || 0) / 100); }
  return { ex: round2(ex), vat: round2(vat), inc: round2(ex + vat) };
}

function numberWords(n) {
  const a = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
  const t = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
  const w = x => x < 20 ? a[x] : x < 100 ? t[Math.floor(x / 10)] + (x % 10 ? '-' + a[x % 10] : '') : a[Math.floor(x / 100)] + ' Hundred' + (x % 100 ? ' and ' + w(x % 100) : '');
  const parts = [[1e9, 'Billion'], [1e6, 'Million'], [1e3, 'Thousand'], [1, '']];
  let int = Math.floor(n), out = [];
  for (const [v, l] of parts) { const q = Math.floor(int / v); if (q) { out.push(w(q) + (l ? ' ' + l : '')); int -= q * v; } }
  const fils = Math.round((n - Math.floor(n)) * 100);
  return 'AED ' + (out.join(' ') || 'Zero') + (fils ? ` and ${w(fils)} Fils` : '') + ' Only';
}

function parseSapText(txt, dr) {
  const map = [[/invoice\s*(no|number|#)/i, 'no'], [/invoice\s*date|doc(ument)?\s*date|billing\s*date/i, 'date'], [/customer\s*(code|no|number)|sold.?to/i, 'customerCode'], [/\bpo\b|purchase\s*order|work\s*order|reference/i, 'poNo'], [/\btrn\b|tax\s*reg/i, 'trn'], [/entity|customer\s*name|bill.?to/i, 'entity']];
  let n = 0;
  const lines = txt.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  // format A: "Label: value" or "Label<TAB>value" per line
  for (const l of lines) {
    const m = l.match(/^([^:\t]+)[:\t]\s*(.+)$/); if (!m) continue;
    const hit = map.find(([re]) => re.test(m[1])); if (!hit) continue;
    let val = m[2].trim(); if (hit[1] === 'date') val = parseAnyDate(val) || val;
    dr[hit[1]] = val; n++;
  }
  // format B: a header row + a value row copied from an SAP list (tab separated)
  if (!n && lines.length >= 2 && lines[0].includes('\t')) {
    const hd = lines[0].split('\t'), vals = lines[1].split('\t');
    hd.forEach((h, i) => { const hit = map.find(([re]) => re.test(h)); if (hit && vals[i]) { dr[hit[1]] = hit[1] === 'date' ? (parseAnyDate(vals[i]) || vals[i]) : vals[i].trim(); n++; } });
  }
  return n;
}

async function mergePdfs(name) {

/* =====================================================================
   Excel import (master payroll sheet, client timesheet workbook) and
   Excel export (master, client timesheets)
   ===================================================================== */
const CODE_ALIAS = { SICK: 'SL', O: 'OFF', 'DAY OFF': 'OFF', PP: 'P', PRESENT: 'P', ABSENT: 'A', RELIEVER: 'R', SRIA: 'SIRA' };
const END_WORDS = ['TERMINATED', 'RESIGNED', 'RESIGN', 'ABSCONDED', 'ABSCONDING', 'CANCELLED', 'VISA CANCELLED', 'TRANSFERRED'];
const normCode = v => { const s = norm(v).replace(/\s*\.\s*/g, '.'); if (/^SIRA ?\.?T\.?$/.test(s)) return 'SIRA.T'; return CODE_ALIAS[s] || s; };

async function readWorkbook(file) {
  await loadScript(LIB.xlsx);
  return XLSX.read(await file.arrayBuffer(), { type: 'array' });
}
const sheetRows = (wb, name) => XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: true, defval: null, blankrows: true });
const isHidden = (wb, i) => !!wb.Workbook?.Sheets?.[i]?.Hidden;

function ensureCode(code, stats) {
  if (IX.code.has(code)) return;
  S.codes.push({ code, label: code, color: '#e9e2f7', billable: false, client: false, key: '' });
  reindex(); stats && (stats.newCodes ||= new Set()).add(code);
}
function findOrCreateSite(name, projectId, stats) {
  const n = norm(name); if (!n) return null;
  let s = S.sites.find(x => norm(x.name) === n && (x.projectId || null) === (projectId || null))
    || (projectId && S.sites.find(x => norm(x.name) === n && !x.projectId))
    || (!projectId && S.sites.find(x => norm(x.name) === n));
  if (s) { if (projectId && !s.projectId) s.projectId = projectId; return s.id; }
  s = { id: uid('s'), projectId: projectId || null, name: n }; S.sites.push(s); IX.site.set(s.id, s);
  if (stats) stats.newSites = (stats.newSites || 0) + 1;
  return s.id;
}
/** Same project spelled differently across files: "SCL - TR - DIC LV 5" = "DIC TR LV-5", "SONAPURE-2" = "SONAPUR TR-2", "JABEL ALI TR-1" = "SCL - JEBEL ALI TR-1" */
function projKey(name) {
  let t = norm(name).replace(/\([^)]*\)/g, ' ').replace(/SUPERVISORS/g, 'SUPERVISOR').replace(/JABEL/g, 'JEBEL').replace(/QOUZ/g, 'QUOZ').replace(/KHWANEEJ/g, 'KHAWANEEJ')
    .replace(/SONAPURE?/g, 'SONAPUR TR').replace(/TR'S/g, 'TR').replace(/\bII\b/g, '2').replace(/[^A-Z0-9]+/g, ' ').trim().split(' ')
    .filter(x => x && !['NEW', 'UNDER', 'FURNITURE', 'INDUSTRY'].includes(x)).map(x => x.replace(/^0+(\d)/, '$1'));
  if (t[0] === 'SCL' && t.length > 2 && t.includes('TR')) t = t.slice(1);
  return [...new Set(t)].sort().join(' ');
}
function findOrCreateProject(name, stats) {
  const n = norm(name), k = projKey(n);
  let p = S.projects.find(x => norm(x.name) === n) || S.projects.find(x => projKey(x.name) === k);
  if (p) return p;
  p = { id: uid('p'), clientId: '', code: '', name: n, entityName: '', poNo: '', billing: { basis: 'ratecard', rate: 0, vat: 0, posts: 0, unit: 'Security', rates: {} }, active: true };
  S.projects.push(p); IX.proj.set(p.id, p); if (stats) stats.newProjects = (stats.newProjects || 0) + 1;
  return p;
}
function splitIdAgency(raw) {
  const s = norm(raw);
  if (!s) return { empCode: '', agency: '' };
  if (/^C\d{3,}$/.test(s)) return { empCode: s, agency: '' };
  const m = s.match(/^SUBCON\s*\(?\s*([^)]*)\)?$/); if (m) return { empCode: '', agency: m[1].trim() || 'SUBCON' };
  if (/^[A-Z]{0,3}\d{3,}$/.test(s)) return { empCode: s, agency: '' };
  return { empCode: '', agency: s };
}
function findEmployee(empCode, name, agency) {
  if (empCode) { const e = S.employees.find(x => x.empCode === empCode); if (e) return e; }
  const n = norm(name);
  return S.employees.find(x => norm(x.name) === n && (!empCode || !x.empCode) && (x.agency || '') === (agency || '')) || null;
}

/* ---------- master payroll sheet ---------- */
function parseMasterSheet(rows) {
  let hr = -1;
  for (let i = 0; i < Math.min(rows.length, 25); i++) if ((rows[i] || []).some(v => norm(v) === 'NAME')) { hr = i; break; }
  if (hr < 0) return null;
  const hdr = [rows[hr - 2] || [], rows[hr - 1] || [], rows[hr]];
  const width = Math.max(...hdr.map(r => r.length));
  const col = {};
  for (let c = 0; c < width; c++) {
    const L = hdr.map(r => norm(r[c]));
    if (L.includes('NAME')) col.name = c;
    if (L.some(l => /EMP\.?\s*ID|EMP\.?\s*CODE|STAFF\s*ID|^COMPANY$/.test(l))) col.id ??= c;
    if (L.some(l => l === 'D.O.J' || l === 'DOJ' || /JOINING/.test(l))) col.doj = c;
    if (L.some(l => /^TRADE\b/.test(l) || l === 'DESIGNATION')) col.trade = c;
    if (L.some(l => l === 'PROJECT' || l === 'SITE' || l === 'SITE NAME' || /^PROJECT \(SITE NAME\)$/.test(l))) col.site = c;
  }
  // day columns = longest run of consecutive dates in the header row (or the row above)
  const findDates = r => { const out = []; for (let c = 0; c < width; c++) { const iso = parseAnyDate(r[c]); if (iso && iso >= '2015' && iso <= '2040') out.push({ c, iso }); } return out; };
  let cand = findDates(hdr[2]); if (cand.length < 7) cand = findDates(hdr[1]);
  let best = [], run = [];
  for (const x of cand) { if (run.length && x.iso === addDays(run[run.length - 1].iso, 1) && x.c === run[run.length - 1].c + 1) run.push(x); else run = [x]; if (run.length > best.length) best = [...run]; }
  if (best.length < 7 || col.name == null) return null;
  // shift column = the one holding DAY / NIGHT values
  let shiftBest = 0;
  for (let c = 0; c < width; c++) {
    let n = 0; for (let r = hr + 1; r < Math.min(rows.length, hr + 60); r++) if (['DAY', 'NIGHT'].includes(norm(rows[r]?.[c]))) n++;
    if (n > shiftBest) { shiftBest = n; col.shift = c; }
  }
  if (shiftBest < 3) delete col.shift;
  const out = [];
  for (let r = hr + 1; r < rows.length; r++) {
    const row = rows[r] || []; const name = row[col.name];
    if (typeof name !== 'string' || !name.trim()) continue;
    const N = norm(name); if (N === 'NAME' || /PREPARED BY|REVIEWED BY|APPROVED BY|GRAND TOTAL/.test(N)) continue;
    const id = col.id != null ? row[col.id] : null;
    const cells = best.map(x => row[x.c]);
    const hasCodes = cells.some(v => v != null && String(v).trim() !== '');
    const shift = col.shift != null ? norm(row[col.shift]) : '';
    if (!id && !hasCodes && !['DAY', 'NIGHT'].includes(shift)) continue;
    out.push({ name: N, id: id == null ? '' : String(id), shift: ['DAY', 'NIGHT'].includes(shift) ? shift : '', doj: col.doj != null ? parseAnyDate(row[col.doj]) : null, trade: col.trade != null ? norm(row[col.trade]) : '', site: col.site != null ? norm(row[col.site]) : '', cells });
  }
  return { dates: best.map(x => x.iso), rows: out };
}

function applyMasterImport(parsed, overwrite) {
  const st = { created: 0, updated: 0, cells: 0, ended: 0 };
  const start = parsed.dates[0];
  for (const r of parsed.rows) {
    const { empCode, agency } = splitIdAgency(r.id);
    let e = findEmployee(empCode, r.name, agency);
    if (!e) {
      e = { id: uid('e'), empCode, name: r.name, agency, trade: r.trade || 'SECURITY GUARD', shift: r.shift || 'DAY', doj: r.doj, end: null, endReason: '', assign: [] };
      S.employees.push(e); IX.emp.set(e.id, e); st.created++;
    } else {
      st.updated++;
      if (r.trade) e.trade = r.trade; if (r.doj) e.doj = r.doj; if (r.shift) e.shift = r.shift;
      if (r.name && r.name !== e.name && empCode) e.name = r.name;
    }
    if (e.trade && !S.settings.trades.includes(e.trade)) S.settings.trades.push(e.trade);
    const siteId = r.site ? findOrCreateSite(r.site, null, st) : null;
    if (siteId) {
      const a = assignOn(e, start);
      const mapped = a && IX.site.get(a.site)?.projectId;   // allocation set from a client timesheet or by hand wins over the payroll label
      if (!a || (!mapped && a.site !== siteId) || (r.shift && a.shift !== r.shift)) {
        const from = !e.assign.length && e.doj && e.doj < start ? e.doj : start;
        setAssignment(e, from, mapped ? a.site : siteId, r.shift || a?.shift || e.shift);
      }
    }
    for (let i = 0; i < parsed.dates.length; i++) {
      const d = parsed.dates[i]; const raw = r.cells[i];
      const code = raw == null ? '' : normCode(raw);
      if (END_WORDS.includes(code)) {
        const last = addDays(d, -1);
        if (!e.end || e.end > last) { e.end = last; e.endReason = code; st.ended++; }
        for (let k = i; k < parsed.dates.length; k++) if (overwrite && S.att[e.id]) delete S.att[e.id][parsed.dates[k]];
        break;
      }
      if (!code || /^\d+(\.\d+)?$/.test(code) || code.startsWith('#')) { if (overwrite && !code && S.att[e.id]?.[d]) delete S.att[e.id][d]; continue; }
      if (!overwrite && S.att[e.id]?.[d]) continue;
      ensureCode(code, st);
      const cur = getCell(e.id, d);
      putCell(e.id, d, { c: code, s: cur?.s, sh: cur?.sh }); st.cells++;
    }
  }
  reindex();
  return st;
}

/* ---------- client timesheet workbook (one tab per project) ---------- */
/**
 * Client timesheet layouts:
 *  A) one project per sheet (SCL TR TIME SHEET): "PROJECT NAME" + "MONTH" labels above a SITE NAME header
 *  B) CLIENT TIME SHEET in the master workbook: header row PROJECT | SITE NAME | SHIFT | NAME | EMP. CODE | 1..31
 */
function parseClientSheet(rows) {
  let hr = -1, project = '', ym = null;
  for (let i = 0; i < Math.min(rows.length, 40); i++) {
    const row = rows[i] || [];
    row.forEach((v, c) => {
      const n = norm(v);
      if (n === 'PROJECT NAME' && !project && !row.some(x => norm(x) === 'SITE NAME')) project = norm(row.slice(c + 1).find(x => x != null && String(x).trim()));
      if (/^MONTH\b/.test(n) && !ym) ym = parseAnyMonth(n.replace(/^MONTH\s*:?\s*/, '')) || parseAnyMonth(row.slice(c + 1).find(x => x != null && String(x).trim()));
    });
    if (hr < 0 && row.some(v => norm(v) === 'SITE NAME')) hr = i;
  }
  if (hr < 0) return null;
  const h = rows[hr]; const col = { days: [] };
  h.forEach((v, c) => {
    const n = norm(v);
    if (n === 'SITE NAME') col.site = c; else if (n === 'PROJECT' || n === 'PROJECT NAME') col.project = c; else if (n.startsWith('SHIFT')) col.shift = c;
    else if (n === 'NAME') col.name = c; else if (/EMP/.test(n)) col.code = c;
    else if ((typeof v === 'number' || /^\d{1,2}$/.test(n)) && +n >= 1 && +n <= 31 && Number.isInteger(+n)) col.days.push({ c, day: +n });
  });
  if (col.name == null || col.days.length < 28) return null;
  if (col.project == null && !project) return null;
  const out = []; let site = '', proj = project;
  for (let r = hr + 1; r < rows.length; r++) {
    const row = rows[r] || [];
    if (row.some(v => /PREPARED BY/.test(norm(v)))) break;
    if (col.project != null && norm(row[col.project]) && !/GRAND TOTAL|^TOTAL/.test(norm(row[col.project]))) { if (norm(row[col.project]) !== proj) site = ''; proj = norm(row[col.project]); }
    if (col.site != null && norm(row[col.site])) site = norm(row[col.site]);
    const name = norm(row[col.name]); if (!name || /GRAND TOTAL/.test(name)) continue;
    const cells = {};
    for (const { c, day } of col.days) { const v = row[c]; if (v != null && String(v).trim() !== '') cells[day] = normCode(v); }
    out.push({ project: proj, site, shift: norm(row[col.shift]), name, id: col.code != null ? String(row[col.code] ?? '') : '', cells });
  }
  return { project: project || null, multi: col.project != null, ym, rows: out, projects: [...new Set(out.map(r => r.project))] };
}

/** Billing client per project, following the groups in Trackers.xlsx → Tax Invoice Tracker (A SCL & Infra … H Factories) */
const CLIENT_RULES = [
  [/^KAIZEN\b/, 'KAIZEN OWNERS ASSOCIATION'],
  [/^(ASTECO|PROVIS)\b/, 'PROVIS OWNERS ASSOCIATION'],
  [/^SCM\b/, 'SOBHA COMMUNITY MANAGEMENT LLC'],
  [/^LFM\b|NURSERY/, 'LFM & LANDSCAPING'],
  [/^RAK\b/, 'SOBHA MODULAR - RAK'],
  [/FURNITURE INDUSTRIES/, 'SOBHA FURNITURE INDUSTRIES - KIZAD'],
  [/^(SOBHA REALTY|CRM|DEVELOPMENT|PNCA)\b/, 'SOBHA LLC'],
  [/^RELIEVER$|CRUSHER/, ''],
  [/./, 'SOBHA CONSTRUCTIONS LLC']
];
function clientForProjectName(name) {
  const hit = CLIENT_RULES.find(([re]) => re.test(norm(name))); if (!hit || !hit[1]) return '';
  let c = S.clients.find(x => norm(x.name) === hit[1]);
  if (!c) { c = { id: uid('c'), name: hit[1], customerCode: '', trn: '', address: '' }; S.clients.push(c); IX.client.set(c.id, c); }
  return c.id;
}
/** "Replace": a client timesheet is authoritative for the month for every worker on it – days on none of their rows are cleared */
function clearUntouched(tm, overwrite) {
  if (!overwrite) return;
  for (const [ym, touched] of tm) for (const [id, days] of touched) for (const d of monthDates(ym)) if (!days.has(d) && S.att[id]?.[d]) delete S.att[id][d];
}
/** Link payroll site labels (e.g. "THE CREST") to the client-timesheet project most of their workers are allocated to (e.g. "SCM THE CREST") */
function autoMapSites() {
  let n = 0;
  for (const site of S.sites.filter(x => !x.projectId)) {
    const votes = {}; let total = 0;
    for (const e of S.employees) {
      const i = (e.assign || []).findIndex(a => a.site === site.id); if (i < 0) continue;
      const later = e.assign.slice(i + 1).find(a => IX.site.get(a.site)?.projectId); if (!later) continue;
      const pid = IX.site.get(later.site).projectId; votes[pid] = (votes[pid] || 0) + 1; total++;
    }
    const best = Object.entries(votes).sort((a, b) => b[1] - a[1])[0];
    if (best && best[1] / total >= 0.6) { site.projectId = best[0]; n++; }
  }
  reindex(); return n;
}
/** Remove unmapped sites nobody uses any more (payroll labels replaced by client-timesheet sites) */
function pruneSites() {
  const used = new Set();
  for (const e of S.employees) for (const a of e.assign || []) used.add(a.site);
  for (const k in S.att) for (const d in S.att[k]) { const v = S.att[k][d]; if (typeof v === 'object' && v.s) used.add(v.s); }
  const before = S.sites.length; S.sites = S.sites.filter(x => x.projectId || used.has(x.id)); reindex(); return before - S.sites.length;
}

function applyClientImport(parsed, overwrite, ymOverride, shared) {
  const st = { created: 0, cells: 0, conflicts: 0 };
  const ym = parsed.ym || ymOverride;
  st.ym = ym; if (!ym) throw new Error('Month missing for ' + (parsed.project || 'client timesheet'));
  const lastReal = {}, seen = shared?.seen || new Set();
  const tm = shared?.touched || new Map(); if (!tm.has(ym)) tm.set(ym, new Map()); const touched = tm.get(ym);
  for (const r of parsed.rows) {
    if (!r.project) continue;
    const proj = findOrCreateProject(r.project, st);
    if (!proj.clientId) proj.clientId = clientForProjectName(proj.name);
    const rel = /RELIEVER|RELEIVER/.test(r.site);
    const siteId = rel ? (lastReal[proj.id] || findOrCreateSite(r.project, proj.id, st)) : findOrCreateSite(r.site || r.project, proj.id, st);
    if (!rel) lastReal[proj.id] = siteId;
    const { empCode, agency } = splitIdAgency(r.id);
    let e = findEmployee(empCode, r.name, agency);
    const shift = ['DAY', 'NIGHT'].includes(r.shift) ? r.shift : '';
    if (!e) {
      const trade = /CCTV/.test(r.site) ? 'CCTV OPERATOR' : /TEAM LEADER/.test(r.site) ? 'TEAM LEADER' : /SUPERVISOR/.test(r.site) ? 'SECURITY SUPERVISOR' : 'SECURITY GUARD';
      e = { id: uid('e'), empCode, name: r.name, agency, trade, shift: shift || 'DAY', doj: null, end: null, endReason: '', assign: [] };
      S.employees.push(e); IX.emp.set(e.id, e); st.created++;
    }
    if (!rel && assignOn(e, ym + '-01')?.site !== siteId && !seen.has(e.id)) setAssignment(e, ym + '-01', siteId, shift || e.shift);
    if (!rel) seen.add(e.id);
    for (const [day, raw] of Object.entries(r.cells).sort((a, b) => +a[0] - +b[0])) {
      if (/^\d+(\.\d+)?$/.test(raw) || raw.startsWith('#') || +day > dim(ym)) continue;
      const d = `${ym}-${pad(day)}`;
      if (END_WORDS.includes(raw)) { const last = addDays(d, -1); if (!e.end || e.end > last) { e.end = last; e.endReason = raw; st.ended = (st.ended || 0) + 1; } break; }
      const code = rel && raw === 'P' ? 'R' : raw;
      if (touched.get(e.id)?.has(d) && codeDef(getCell(e.id, d)?.c).billable && codeDef(code).billable) {
        (st.double ||= []).push(`${e.name} ${fmtDMY(d)}: ${IX.site.get(siteOn(e, d))?.name || '?'} / ${r.site || r.project}`);
      }
      const prev = getCell(e.id, d);
      if (!overwrite && prev) continue;
      if (prev && prev.c !== code && !touched.get(e.id)?.has(d)) st.conflicts++;
      ensureCode(code, st);
      const a = assignOn(e, d);
      putCell(e.id, d, { c: code, s: siteId !== a?.site ? siteId : undefined, sh: shift && shift !== (a?.shift || e.shift) ? shift : undefined });
      (touched.get(e.id) || touched.set(e.id, new Set()).get(e.id)).add(d);
      st.cells++;
    }
    if (!touched.has(e.id)) touched.set(e.id, new Set());
  }
  if (!shared) clearUntouched(tm, overwrite);
  reindex();
  return st;
}

/** One entry point: detects master-attendance sheets and client-timesheet sheets in any workbook. */
async function importExcel(file) {
  const wb = await readWorkbook(file);
  const found = [];
  wb.SheetNames.forEach((n, i) => {
    const rows = sheetRows(wb, n), hidden = isHidden(wb, i);
    const m = parseMasterSheet(rows);
    if (m && m.rows.length) { found.push({ n, hidden, type: 'master', p: m, info: `${m.rows.length} workers · ${fmtDMY(m.dates[0])} – ${fmtDMY(m.dates[m.dates.length - 1])}` }); return; }
    const c = parseClientSheet(rows);
    if (c && c.rows.length) found.push({ n, hidden, type: 'client', p: c, info: `${c.multi ? c.projects.length + ' projects' : c.project} · ${c.ym ? fmtMonYY(c.ym) : 'month not in sheet'} · ${c.rows.length} rows` });
  });
  if (!found.length) { toast('No attendance found in this file. It needs a NAME column and a row of dates (master sheet), or PROJECT NAME + MONTH + SITE NAME (client timesheet).', 7000); return; }
  const master = found.find(f => f.type === 'master');
  const defYm = master ? ymOf(master.p.dates[master.p.dates.length - 1]) : addMonths(ymOf(todayISO()), -1);
  openModal('Import Excel', `
    <p style="margin-top:0"><b>${esc(file.name)}</b> – tick the sheets to import.</p>
    <table class="t"><thead><tr><th></th><th>Sheet</th><th>Type</th><th>Contents</th></tr></thead><tbody>
    ${found.map((f, k) => `<tr><td><input type="checkbox" data-sh="${k}" ${f.hidden ? '' : 'checked'}></td><td><b>${esc(f.n)}</b>${f.hidden ? ' <span class="tag">hidden</span>' : ''}</td>
      <td><span class="tag ${f.type === 'master' ? 'ok' : ''}">${f.type === 'master' ? 'Master attendance' : 'Client timesheet'}</span></td><td class="small">${esc(f.info)}${f.type === 'client' ? `<div class="row" style="margin-top:4px"><span class="muted">Month:</span><input type="month" data-ym="${k}" value="${f.p.multi && master ? defYm : (f.p.ym || defYm)}">${f.p.ym && f.p.multi && master && f.p.ym !== defYm ? `<span class="tag warn">sheet says ${fmtMonYY(f.p.ym)} – check</span>` : ''}</div>` : ''}</td></tr>`).join('')}
    </tbody></table>
    <label class="chk" style="margin-top:12px"><input type="checkbox" id="im-ow" checked> Replace attendance already entered for the same days</label>`,
    [{ label: 'Cancel' }, {
      label: 'Import', cls: 'pri', onClick: m => {
        const ow = $('#im-ow', m).checked; const t = { created: 0, cells: 0, ended: 0, newSites: 0, newProjects: 0, conflicts: 0 }; const dbl = []; const shared = { touched: new Map(), seen: new Set() }; const codes = new Set(); let lastMaster = null;
        m.querySelectorAll('[data-sh]:checked').forEach(c => {
          const f = found[+c.dataset.sh];
          const r = f.type === 'master' ? applyMasterImport(f.p, ow) : applyClientImport({ ...f.p, ym: m.querySelector(`[data-ym="${c.dataset.sh}"]`)?.value || f.p.ym }, ow, null, shared);
          for (const k in t) t[k] += r[k] || 0; r.newCodes?.forEach(x => codes.add(x)); if (r.double) dbl.push(...r.double);
          if (f.type === 'master' && (!lastMaster || f.p.dates.at(-1) > lastMaster.dates.at(-1))) lastMaster = f.p;
        });
        clearUntouched(shared.touched, ow);
        const pruned = pruneSites(), autoMapped = autoMapSites();
        if (lastMaster) { AV.ym = cycleOfDate(lastMaster.dates[lastMaster.dates.length - 1]); AV.mode = 'payroll'; }
        markDirty(); renderAll();
        const unm = S.sites.filter(x => !x.projectId).length;
        openModal('Import complete', `<div class="kpis">${[['Workers added', t.created], ['Days written', t.cells], ['End dates set', t.ended], ['New sites', t.newSites], ['New projects', t.newProjects]].map(([k, v]) => `<div class="kpi"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('')}</div>
          ${dbl.length ? `<div class="alert"><div><b>${dbl.length} person-day(s) are billed on two rows for the same day</b> in the client timesheet – the tracker keeps the later row. Check these in the source sheet:<div class="small" style="max-height:120px;overflow:auto;margin-top:4px">${dbl.slice(0, 200).map(esc).join('<br>')}</div></div></div>` : ''}
          ${t.conflicts ? `<div class="alert info">${t.conflicts} day(s) differed between the payroll sheet and the client timesheet – the client timesheet was used for client billing.</div>` : ''}
          ${autoMapped ? `<p>${autoMapped} payroll site label(s) were linked automatically to the client-timesheet project most of their workers belong to.</p>` : ''}
          ${codes.size ? `<p>New codes added as <b>not billable</b>: ${[...codes].map(esc).join(', ')} (change in Settings).</p>` : ''}
          ${unm ? `<div class="alert">${unm} site(s) are not linked to a project yet. Link them so they appear on client timesheets and invoices.</div>` : ''}`,
          unm ? [{ label: 'Later' }, { label: 'Link sites now', cls: 'pri', onClick: () => showView('projects') }] : [{ label: 'OK', cls: 'pri' }]);
        return false;
      }
    }]);
}

/* ---------- Excel export (styled, via ExcelJS) ---------- */
const argb = hex => 'FF' + String(hex || '#FFFFFF').replace('#', '').toUpperCase().padEnd(6, 'F').slice(0, 6);
const thin = { top: { style: 'thin' }, left: { style: 'thin' }, bottom: { style: 'thin' }, right: { style: 'thin' } };
const colL = n => { let s = ''; n++; while (n) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; };
function billFormula(range) { return S.codes.filter(c => c.billable).map(c => `COUNTIF(${range},"${c.code}")`).join('+') || '0'; }

async function exportTimesheetsXlsx(list) {
  await loadScript(LIB.exceljs);

    let k = 2; const base = nm; while (used.has(nm.toUpperCase())) nm = (base.slice(0, 28) + ' ' + k++); used.add(nm.toUpperCase());
    const ws = wb.addWorksheet(nm, { pageSetup: { orientation: 'landscape', paperSize: 9, fitToPage: true, fitToWidth: 1, fitToHeight: 0 } });
    const N = ts.days, C0 = 5, CT = C0 + N; // 1-based columns: B site, C shift, D name, E code, F.. days, total
    ws.getColumn(1).width = 2; ws.getColumn(2).width = 26; ws.getColumn(3).width = 8; ws.getColumn(4).width = 34; ws.getColumn(5).width = 16;
    for (let i = 0; i < N; i++) ws.getColumn(C0 + 1 + i).width = 3.6; ws.getColumn(CT + 1).width = 9;

    ws.getCell('B2').value = st.companyShort; ws.getCell('B2').font = { bold: true, size: 14 };

    ws.getCell('B4').value = `Form No: ${st.formNo}`; ws.getCell('I4').value = `REV NO: ${st.revNo}`; ws.getCell(4, CT - 8).value = `DATE : ${st.formDate}`;
    TS_LEGEND.forEach(([a, b], i) => { const c1 = ws.getCell(6 + i, CT), c2 = ws.getCell(6 + i, CT + 1); c1.value = a; c2.value = b; c1.border = c2.border = thin; c1.font = { bold: true }; });
    const [yy, mm] = ts.ym.split('-').map(Number);
    ws.getCell('B8').value = 'MONTH'; ws.getCell('C8').value = new Date(Date.UTC(yy, mm - 1, 1)); ws.getCell('C8').numFmt = 'mmm-yy'; ws.getCell('C8').alignment = { horizontal: 'left' }; ws.getCell('B8').font = { bold: true };
    ws.getCell('B10').value = 'PROJECT NAME'; ws.getCell('C10').value = p?.name || ''; ws.getCell('B10').font = { bold: true };
    const HR = 13;
    const head = ['SITE NAME', 'SHIFT D/N', 'NAME', 'EMP. CODE', ...Array.from({ length: N }, (_, i) => i + 1), 'TOTAL DAYS'];
    head.forEach((v, i) => { const c = ws.getCell(HR, 2 + i); c.value = v; c.font = { bold: true }; c.border = thin; c.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true }; c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFD9E1F2' } }; });
    const pCodes = S.codes.filter(c => c.billable && c.code !== 'R').map(c => c.code);
    let r = HR + 1;
    for (const sec of ts.sections) {
      const r0 = r;
      for (const row of sec.rows) {
        ws.getCell(r, 2).value = r === r0 ? sec.name : null;
        ws.getCell(r, 3).value = row.shift; ws.getCell(r, 4).value = row.emp.name; ws.getCell(r, 5).value = empCodeLabel(row.emp);
        for (let d = 1; d <= N; d++) { const code = row.cells[d]; const c = ws.getCell(r, C0 + d); c.value = code && codeDef(code).client ? (code === 'OFF' ? 'O' : code) : null; c.alignment = { horizontal: 'center' }; }
        const rg = `${colL(C0)}${r}:${colL(C0 + N - 1)}${r}`;
        // template: =COUNTIF(F14:AI14,"P") for site rows, "R" for reliever rows
        const f = (sec.id === '__REL' ? ['R'] : pCodes).map(k => `COUNTIF(${rg},"${k}")`).join('+') || '0';
        ws.getCell(r, CT + 1).value = { formula: f, result: row.total };

      <label class="f">Shift hours (for hourly billing)<input type="number" data-s="shiftHours" value="${st.shiftHours}"></label>
      <label class="f">Shifts (comma separated)<input type="text" data-sl="shifts" value="${esc(st.shifts.join(', '))}"></label>
      <label class="f" style="grid-column:1/-1">Trades (comma separated)<input type="text" data-sl="trades" value="${esc(st.trades.join(', '))}"></label>
      <label class="f" style="grid-column:1/-1">Company address<textarea data-s="address">${esc(st.address)}</textarea></label>
    </div>
    <h3>Timesheet signatories</h3>
    <table class="t"><thead><tr><th>Label</th><th>Name / code</th><th>Title</th></tr></thead><tbody>
      ${st.signatories.map((s, i) => `<tr><td><input type="text" data-sg="${i}" data-sk="label" value="${esc(s.label)}"></td><td><input type="text" data-sg="${i}" data-sk="name" value="${esc(s.name)}" style="width:100%"></td><td><input type="text" data-sg="${i}" data-sk="title" value="${esc(s.title)}" style="width:100%"></td></tr>`).join('')}
    </tbody></table>
  </div>

  <div class="card"><h2 style="color:var(--bad)">Reset</h2>
    <p class="hint" style="margin-top:0">Deletes everything saved in this browser. Download a backup first.</p>
    <button class="btn bad" id="dv-reset">Delete all data…</button></div>`;

  $('#dv-dl').onclick = downloadBackup;
  v.querySelectorAll('[data-rc]').forEach(i => i.onchange = () => { const r = S.settings.rateCard[+i.dataset.rc]; r[i.dataset.rk] = i.dataset.rk === 'rate' ? +i.value || 0 : i.dataset.rk === 'trade' ? norm(i.value) : i.value.trim(); markDirty(); });
  v.querySelectorAll('[data-rcdel]').forEach(b => b.onclick = () => { S.settings.rateCard.splice(+b.dataset.rcdel, 1); markDirty(); renderData(); });
  $('#dv-rcadd').onclick = () => { S.settings.rateCard.push({ trade: '', unit: '', rate: 0, src: '' }); markDirty(); renderData(); };
  $('#dv-rs').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const st = JSON.parse(await f.text()); if (!st.employees || !st.settings) throw new Error('Not a tracker backup file');
      if (!await confirmBox(`Replace all current data with "${f.name}" (${st.employees.length} employees)?`, 'Restore', 'bad')) return;
      S = migrate(st); reindex(); markDirty(); renderAll(); toast('Restored');
    } catch (err) { toast(err.message); }
  };
  v.querySelectorAll('[data-ci]').forEach(i => i.onchange = () => {
    const c = S.codes[+i.dataset.ci]; const k = i.dataset.ck;
    c[k] = i.type === 'checkbox' ? i.checked : i.value.trim();
    if (k === 'key' && c.key) S.codes.forEach(o => { if (o !== c && o.key?.toLowerCase() === c.key.toLowerCase()) o.key = ''; });
    reindex(); markDirty(); if (k === 'key') renderData();
  });
  v.querySelectorAll('[data-cdel]').forEach(b => b.onclick = async () => {
    const c = S.codes[+b.dataset.cdel]; const n = codeUsage(c.code);
    if (n && !await confirmBox(`${c.code} is used on ${n} day(s). Delete the code and clear those days?`, 'Delete', 'bad')) return;
    for (const k in S.att) for (const d in S.att[k]) { const x = S.att[k][d]; if ((typeof x === 'string' ? x : x.c) === c.code) delete S.att[k][d]; }
    S.codes.splice(+b.dataset.cdel, 1); reindex(); markDirty(); renderData();
  });
  $('#dv-addc').onclick = () => {
    const code = normCode($('#dv-nc').value); if (!code) return;
    if (IX.code.has(code)) return toast('Code exists');
    S.codes.push({ code, label: $('#dv-nl').value.trim() || code, color: '#e9e2f7', billable: false, client: false, key: '' }); reindex(); markDirty(); renderData();
  };
  v.querySelectorAll('[data-s]').forEach(i => i.onchange = () => { const k = i.dataset.s; S.settings[k] = i.type === 'number' ? +i.value : i.value; markDirty(); });
  v.querySelectorAll('[data-sl]').forEach(i => i.onchange = () => { S.settings[i.dataset.sl] = i.value.split(',').map(x => norm(x)).filter(Boolean); markDirty(); });
  v.querySelectorAll('[data-sg]').forEach(i => i.onchange = () => { S.settings.signatories[+i.dataset.sg][i.dataset.sk] = i.value; markDirty(); });
  $('#dv-reset').onclick = async () => {
    if (!await confirmBox('Delete ALL employees, attendance, projects and invoices?', 'Delete everything', 'bad')) return;
    S = defaultState(); reindex(); markDirty(); renderAll(); toast('All data deleted');
  };
}
function codeUsage(code) { let n = 0; for (const k in S.att) for (const d in S.att[k]) { const x = S.att[k][d]; if ((typeof x === 'string' ? x : x.c) === code) n++; } return n; }

/* ---------- bootstrap ---------- */
const VIEWS = { attendance: renderAttendance, timesheets: renderTimesheets, invoices: renderInvoices, employees: renderEmployees, projects: renderProjects, data: renderData };
let curView = 'attendance';
function showView(v) {
  curView = v;
  $$('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.view === v));
  $$('.view').forEach(s => s.classList.toggle('on', s.id === 'v-' + v));
  VIEWS[v]();
}
function renderAll() { VIEWS[curView](); }

async function init() {
  let st = null;
  try { const j = await IDB.get('state'); if (j) st = JSON.parse(j); } catch (e) { console.warn('IndexedDB unavailable', e); }
  S = migrate(st || defaultState()); reindex();
  $$('#tabs button').forEach(b => b.onclick = () => showView(b.dataset.view));
  $('#modal-bg').addEventListener('mousedown', e => { if (e.target.id === 'modal-bg') closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modal-bg').classList.contains('on')) closeModal(); });
  $('#hdr-import').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) importExcel(f).catch(err => toast(err.message, 5000)); };
  $('#hdr-backup').onclick = downloadBackup;
  renderSaveState(); showView('attendance');
}
init();

</script>
</body>
</html>
