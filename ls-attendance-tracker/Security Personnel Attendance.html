<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050606">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LS Attendance">
<title>Security Personnel Attendance</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin><link rel="preconnect" href="https://server.arcgisonline.com">
<link rel="preload" as="script" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js">
<!-- fonts load without holding up the first paint; text shows in the system font until they arrive -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mona+Sans:ital,wdth,wght@0,75..125,300..800;1,75..125,300..800&family=Martian+Mono:wdth,wght@75..112.5,400..600&display=swap" media="print" onload="this.media='all'">
<style>
/* Worker app – "field instrument" design language after Delta Climate's OBOS console:
   near-black canvas, warm ink, one bronze accent, Mona Sans + condensed mono labels,
   readouts (big value · small mono label), hairlines, segmented chips, honest notes. */
:root{
  color-scheme:dark;
  --bg:#050606; --s1:#0A0C0C; --s2:#101313; --s3:#171B1B; --s4:#1E2323;
  --line:rgba(236,232,224,.08); --line2:rgba(236,232,224,.14); --line3:rgba(236,232,224,.24);
  --ink:#ECE8E0; --ink2:#C6C2B9; --mute:#8C908A; --faint:#5E635F;
  --bronze:#B08D57; --bronze2:#C9A46A; --bronze-bg:rgba(176,141,87,.12);
  --sage:#93B08F; --sage-bg:rgba(147,176,143,.12); --cyan:#7DB6B9; --red:#D3664F; --red-bg:rgba(211,102,79,.12); --orange:#DA8C50; --gold:#D8B45C; --gold-bg:rgba(216,180,92,.12);
  --on-bronze:#0A0806;
  --r:10px; --r2:16px; --tab:66px; --dock:84px;
  --sans:"Mona Sans",system-ui,-apple-system,"Segoe UI Variable","Segoe UI",Roboto,"Inter","Noto Sans","Noto Sans Devanagari","Noto Nastaliq Urdu","Noto Sans Malayalam",sans-serif;
  --mono:"Martian Mono","JetBrains Mono","SF Mono",ui-monospace,Consolas,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
}
/* Studio (light) – the "clay" counterpart */
:root[data-theme=light]{color-scheme:light;
  --bg:#ECE9E3; --s1:#F4F2ED; --s2:#FBFAF7; --s3:#E3DFD7; --s4:#D8D3CA;
  --line:rgba(20,22,22,.08); --line2:rgba(20,22,22,.14); --line3:rgba(20,22,22,.26);
  --ink:#151717; --ink2:#363A3B; --mute:#6A6E6A; --faint:#9A9C97;
  --bronze:#8E6B35; --bronze2:#A47D41; --bronze-bg:rgba(142,107,53,.10);
  --sage:#4B7A50; --sage-bg:rgba(75,122,80,.10); --cyan:#2E7A80; --red:#B3452F; --red-bg:rgba(179,69,47,.09); --orange:#B5682D; --gold:#9C7A18; --gold-bg:rgba(156,122,24,.10);
  --on-bronze:#FBFAF7}
@media (prefers-color-scheme:light){:root:not([data-theme]){color-scheme:light;
  --bg:#ECE9E3; --s1:#F4F2ED; --s2:#FBFAF7; --s3:#E3DFD7; --s4:#D8D3CA;
  --line:rgba(20,22,22,.08); --line2:rgba(20,22,22,.14); --line3:rgba(20,22,22,.26);
  --ink:#151717; --ink2:#363A3B; --mute:#6A6E6A; --faint:#9A9C97;
  --bronze:#8E6B35; --bronze2:#A47D41; --bronze-bg:rgba(142,107,53,.10);
  --sage:#4B7A50; --sage-bg:rgba(75,122,80,.10); --cyan:#2E7A80; --red:#B3452F; --red-bg:rgba(179,69,47,.09); --orange:#B5682D; --gold:#9C7A18; --gold-bg:rgba(156,122,24,.10);
  --on-bronze:#FBFAF7}}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,select,input,a{touch-action:manipulation}
button{user-select:none;-webkit-user-select:none}
html,body{margin:0;min-height:100%;background:var(--bg)}
body{color:var(--ink);font:400 15px/1.5 var(--sans);font-stretch:100%;-webkit-font-smoothing:antialiased;overscroll-behavior-y:contain}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
::selection{background:var(--bronze);color:var(--on-bronze)}
:focus-visible{outline:1.5px solid var(--bronze);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;font-stretch:80%}
.muted{color:var(--mute)}.small{font-size:12.5px}
.grow{flex:1;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* the signature: small, condensed, tracked mono label */
.k,.lbl{font:500 12px/1.35 var(--sans);letter-spacing:0;color:var(--mute)}
.lbl{margin:0 0 10px;display:flex;justify-content:space-between;gap:8px}
.note{font-size:12.5px;line-height:1.5;color:var(--mute);margin:8px 0 0}
.note b{color:var(--ink2);font-weight:600}

/* ---------- top: brand + crumb ---------- */
.top{position:sticky;top:0;z-index:1500;display:flex;align-items:center;gap:10px;padding:0 14px;padding-top:env(safe-area-inset-top,0);min-height:58px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .mark{width:30px;height:30px;border-radius:8px;border:1px solid var(--bronze);color:var(--bronze);display:grid;place-items:center;font:600 11px var(--mono);letter-spacing:.04em;flex:none}
.crumb{margin:0;display:flex;align-items:center;gap:0;min-width:0;font:500 12px/1.35 var(--sans);letter-spacing:0;color:var(--mute);white-space:nowrap;overflow:hidden}
.crumb span::after{content:"/";margin:0 .6em;color:var(--faint)}
.crumb b{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.ib{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;min-width:40px;padding:0 10px;border:1px solid var(--line2);border-radius:var(--r);background:transparent;color:var(--ink2);cursor:pointer;font:500 12px/1.35 var(--sans);letter-spacing:0}
.ib:active{background:var(--s3)}
.synthetic{display:flex;align-items:center;gap:8px;padding:7px 16px;font:500 12px/1.35 var(--sans);letter-spacing:0;color:var(--gold);border-bottom:1px solid var(--line)}
.synthetic span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.synthetic .d{width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px var(--gold-bg);flex:none}

main{max-width:560px;margin:0 auto;padding:18px 16px calc(var(--tab) + var(--dock) + 22px + env(safe-area-inset-bottom,0))}
body.notabs main{padding-bottom:calc(28px + env(safe-area-inset-bottom,0))}
body.nodock main{padding-bottom:calc(var(--tab) + 22px + env(safe-area-inset-bottom,0))}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r2);padding:16px;margin-bottom:12px}
.card h2{margin:0 0 4px;font-size:19px;font-weight:600;letter-spacing:-.01em}

/* ---------- place hero ---------- */
.place{margin:2px 0 16px}
.place .n{font-size:30px;line-height:1.08;font-weight:600;letter-spacing:-.025em;font-stretch:92%}
.place .n em{font-style:italic;font-weight:300;color:var(--ink2)}
.place .z{margin-top:8px;font:500 12px/1.35 var(--sans);letter-spacing:0;color:var(--mute)}
.place .z b{color:var(--bronze);font-weight:600}

/* ---------- clock (stacked day/meridiem · time · shift rule) ---------- */
.clockw{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;background:var(--s1);border:1px solid var(--line);border-radius:var(--r2);padding:16px 16px 14px;margin-bottom:12px}
.k-stack{display:flex;flex-direction:column;gap:3px;font:600 9.5px var(--mono);font-stretch:75%;letter-spacing:.14em}
.k-stack span{color:var(--faint)}.k-stack .on{color:var(--ink)}.k-stack .k-day{color:var(--bronze)}
.k-time{font-size:46px;line-height:1;font-weight:500;letter-spacing:-.03em;font-variant-numeric:tabular-nums;font-stretch:88%}
.k-side{text-align:end}
.k-side b{display:block;white-space:nowrap;font:500 22px var(--sans);font-variant-numeric:tabular-nums;letter-spacing:-.01em;margin-top:4px}
.k-side b.on{color:var(--sage)}
.k-rule{grid-column:1/-1;margin-top:4px}
.k-bar{position:relative;height:3px;border-radius:2px;background:var(--s4);overflow:visible}
.k-bar i{position:absolute;inset:0;transform-origin:0 50%;background:var(--bronze);border-radius:2px}
.k-bar u{position:absolute;top:-4px;width:2px;height:11px;background:var(--ink);border-radius:1px;text-decoration:none}
.k-ends{display:flex;justify-content:space-between;margin-top:7px}

/* ---------- readouts ---------- */
.liverow{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:var(--r2);background:var(--s1);margin-bottom:12px}
.liverow>div{padding:12px 10px 11px;border-inline-start:1px solid var(--line);min-width:0}
.liverow>div:first-child{border-inline-start:0}
.liverow b{display:block;font-size:21px;font-weight:500;letter-spacing:-.015em;font-variant-numeric:tabular-nums;white-space:nowrap}
.liverow b small{font-size:12px;color:var(--mute);font-weight:400;margin-inline-start:2px}
.liverow span{display:block;margin-top:3px}

/* confidence badge (GPS / zone verdict) */
#gps{margin:0 0 12px}
.conf{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:var(--r);border:1px solid var(--line2);font-size:13.5px;line-height:1.35;color:var(--ink2)}
.conf .d{width:8px;height:8px;border-radius:50%;background:var(--mute);flex:none}
.conf.ok{border-color:color-mix(in srgb,var(--sage) 45%,transparent);background:var(--sage-bg);color:var(--ink)}.conf.ok .d{background:var(--sage);box-shadow:0 0 0 4px var(--sage-bg)}
.conf.warn{border-color:color-mix(in srgb,var(--gold) 45%,transparent);background:var(--gold-bg);color:var(--ink)}.conf.warn .d{background:var(--gold)}
.conf.bad{border-color:color-mix(in srgb,var(--red) 45%,transparent);background:var(--red-bg);color:var(--ink)}.conf.bad .d{background:var(--red)}
.conf .tag{margin-inline-start:auto;flex:none}
.conf.wait .d{animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}

/* ---------- map ---------- */
.mapcard{position:relative;border-radius:var(--r2);overflow:hidden;border:1px solid var(--line);margin-bottom:12px;background:var(--s2)}
#map{height:clamp(220px,34vh,360px);background:var(--s2);position:relative;z-index:0;isolation:isolate}
.mapcard .modechip{position:absolute;z-index:5;top:10px;inset-inline-start:10px}
.mapcard .tools{position:absolute;z-index:5;inset-inline-end:10px;bottom:30px;display:flex;flex-direction:column;gap:8px}
.mapcard .tools button{width:42px;height:42px;border-radius:var(--r);border:1px solid var(--line2);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(8px);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.mapcard .cap{position:absolute;z-index:5;inset-inline-start:10px;bottom:8px;display:flex;align-items:center;gap:7px;padding:4px 8px;border-radius:6px;background:color-mix(in srgb,var(--bg) 80%,transparent);font:500 12px/1.35 var(--sans);letter-spacing:0;color:var(--ink2)}
.mapcard .cap .d{width:6px;height:6px;border-radius:50%;background:var(--sage)}
.mapcard.full{position:fixed;inset:0;z-index:1800;border-radius:0;margin:0;border:0}
.mapcard.full #map{height:100%}
.mapcard .x{position:absolute;z-index:6;top:calc(10px + env(safe-area-inset-top,0));inset-inline-end:10px;display:none}
.mapcard.full .x{display:inline-flex}
.mapcard.full .modechip{top:calc(10px + env(safe-area-inset-top,0))}

/* segmented chips (.modechip / .seg) */
.modechip,.seg{display:inline-flex;padding:3px;gap:2px;border:1px solid var(--line2);border-radius:var(--r);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(8px)}
.modechip button,.seg button{border:0;background:transparent;color:var(--mute);border-radius:7px;padding:0 12px;min-height:40px;font:500 12px/1.35 var(--sans);letter-spacing:0;cursor:pointer;white-space:nowrap}
.modechip button.on,.seg button.on{background:var(--ink);color:var(--bg)}
.seg{display:flex;width:100%;margin-bottom:12px;background:var(--s1)}
.seg button{flex:1;min-height:40px}

/* ---------- dock: the one primary action ---------- */
.dock{position:fixed;left:0;right:0;bottom:calc(var(--tab) + env(safe-area-inset-bottom,0));z-index:1390;padding:10px 16px 12px;background:linear-gradient(to top,var(--bg) 70%,transparent)}
.dock .in{max-width:560px;margin:0 auto}
.big{position:relative;display:flex;align-items:center;gap:14px;width:100%;min-height:62px;padding:0 18px;border-radius:14px;border:1px solid transparent;cursor:pointer;text-align:start;transition:transform .15s var(--ease)}
.big .lab{display:block;font:600 12px/1.35 var(--sans);letter-spacing:0}
.big small{display:block;font:400 12.5px var(--sans);letter-spacing:0;text-transform:none;opacity:.75;margin-top:3px}
.big svg.i{width:22px;height:22px;margin-inline-start:auto;stroke-width:1.8}
.big.in{background:var(--bronze);color:var(--on-bronze)}
.big.out{background:var(--s1);border-color:var(--line3);color:var(--ink)}
.big.out .lab::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--sage);margin-inline-end:9px;vertical-align:1px;animation:blink 1.6s infinite}
.big:active{transform:scale(.985)}
.big:disabled{opacity:.45}

/* queue */
.q{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--ink);background:var(--gold-bg);border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);border-radius:var(--r);padding:10px 14px;margin-bottom:12px}
.q svg.i{color:var(--gold)}

/* ---------- readings / timeline (kept as .list) ---------- */
.list{margin:0;padding:0;list-style:none}
.list li{display:flex;gap:12px;align-items:center;padding:12px 0;min-height:54px;border-top:1px solid var(--line);font-size:14px}
.list li:first-child{border-top:0}
.list .tm{font:500 13px var(--mono);font-stretch:80%;color:var(--ink);min-width:50px;font-variant-numeric:tabular-nums}
.list .what{display:block;font-weight:500}
.list .sub{display:block;font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .ev{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;border:1px solid var(--line2);color:var(--ink2);flex:none}
.list .ev svg.i{width:15px;height:15px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:6px;font:500 12px/1.35 var(--sans);letter-spacing:0;border:1px solid var(--line2);color:var(--ink2);white-space:nowrap}
.chip.pos{color:var(--sage);border-color:color-mix(in srgb,var(--sage) 40%,transparent);background:var(--sage-bg)}
.chip.warn{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 40%,transparent);background:var(--gold-bg)}
.chip.neg{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,transparent);background:var(--red-bg)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:6px;padding:4px 9px;font:500 12px/1.35 var(--sans);letter-spacing:0;border:1px solid var(--line2);color:var(--ink2);white-space:nowrap}
.pill.pos{color:var(--sage);border-color:color-mix(in srgb,var(--sage) 40%,transparent);background:var(--sage-bg)}.pill.warn{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 40%,transparent);background:var(--gold-bg)}.pill.neg{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,transparent);background:var(--red-bg)}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--mute);padding:20px 8px 12px;text-align:center;font-size:13.5px}
.empty svg.i{width:26px;height:26px;color:var(--faint)}

/* ---------- tab rail (bottom) ---------- */
.tabs-b{position:fixed;left:0;right:0;bottom:0;z-index:1400;display:flex;justify-content:center;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0)}
.tabs-b .in{display:flex;width:100%;max-width:560px}
.tabs-b button{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;height:var(--tab);border:0;background:none;color:var(--faint);cursor:pointer;font:500 12px/1.35 var(--sans);letter-spacing:0}
.tabs-b button svg.i{width:21px;height:21px}
.tabs-b button.on{color:var(--ink)}
.tabs-b button.on::before{content:"";position:absolute;top:-1px;left:28%;right:28%;height:2px;background:var(--bronze);border-radius:0 0 2px 2px}

/* ---------- buttons, fields ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:1px solid var(--line2);background:transparent;border-radius:var(--r);padding:0 18px;min-height:50px;font:600 12px/1.35 var(--sans);letter-spacing:0;cursor:pointer;color:var(--ink)}
.btn.pri{background:var(--bronze);border-color:var(--bronze);color:var(--on-bronze)}
.btn.ghost{border-color:transparent;color:var(--bronze)}
.btn.wide{width:100%}
.btn:disabled{opacity:.4}
.btn:active{transform:translateY(1px)}
.btn svg.i{width:16px;height:16px}
input.f,select.f,textarea.f{width:100%;border:1px solid var(--line2);border-radius:var(--r);padding:12px 14px;min-height:52px;background:var(--s2);font:400 17px var(--sans);color:var(--ink)}
input.f.mono{font:500 18px var(--mono);font-stretch:85%;letter-spacing:.08em}
input.f:focus,select.f:focus{outline:none;border-color:var(--bronze);box-shadow:0 0 0 3px var(--bronze-bg)}
input.f::placeholder{color:var(--faint)}
select.f{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-inline-end:34px}
label.fl{display:block;margin:14px 0 7px;font:500 12px/1.35 var(--sans);letter-spacing:0;color:var(--mute)}

/* ---------- sign in ---------- */
.hero{padding:26px 2px 18px}
.hero .kick{font:500 12px/1.35 var(--sans);letter-spacing:0;color:var(--bronze);margin:0 0 12px}
.hero h1{margin:0;font-size:34px;line-height:1.05;font-weight:600;letter-spacing:-.03em;font-stretch:90%}
.hero h1 em{font-style:italic;font-weight:300;color:var(--ink2)}
.hero p{margin:10px 0 0;color:var(--mute);font-size:14.5px}
.idchip{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line2);border-radius:var(--r);padding:5px 5px 5px 14px;font:500 15px var(--mono);font-stretch:85%;letter-spacing:.1em;color:var(--ink)}
.idchip button{border:0;background:var(--s3);color:var(--ink2);border-radius:7px;padding:0 12px;min-height:38px;font:500 12px/1.35 var(--sans);letter-spacing:0;cursor:pointer}
.dots{display:flex;gap:18px;justify-content:center;margin:22px 0 12px}
.dots i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--line3);transition:background .15s,border-color .15s,transform .15s var(--ease)}
.dots i.on{background:var(--bronze);border-color:var(--bronze);transform:scale(1.15)}
.dots.shake{animation:shake .38s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:360px;margin:6px auto 0}
.pad button{height:64px;border-radius:14px;border:1px solid var(--line);background:var(--s1);font:400 26px var(--sans);font-variant-numeric:tabular-nums;color:var(--ink);cursor:pointer}
.pad button:active{background:var(--s3);border-color:var(--line2)}
.pad button.fn{background:transparent;border-color:transparent;color:var(--mute)}
.pad button.fn svg.i{width:20px;height:20px}
.err{color:var(--red);text-align:center;min-height:20px;font:500 12px/1.35 var(--sans);letter-spacing:0}

/* ---------- camera ---------- */
.cam{position:fixed;inset:0;background:#000;z-index:2000;display:flex;flex-direction:column}
.cam video,.cam img{flex:1;min-height:0;width:100%;object-fit:cover;background:#000}
.cam img{object-fit:contain}
.cam .oval{position:absolute;left:50%;top:44%;width:min(62vw,300px);aspect-ratio:3/4;transform:translate(-50%,-50%);border-radius:50%;box-shadow:0 0 0 200vmax rgba(5,6,6,.55);border:1.5px solid rgba(236,232,224,.9);pointer-events:none}
.cam .ctl{display:flex;gap:10px;align-items:center;padding:16px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0));background:#050606;border-top:1px solid rgba(236,232,224,.08)}
.cam .ctl .btn{flex:1;color:#ECE8E0;border-color:rgba(236,232,224,.2)}
.cam .ctl .btn.pri{color:#0A0806;background:#B08D57;border-color:#B08D57}
.cam .shoot{width:76px;height:76px;border-radius:50%;border:3px solid #ECE8E0;background:transparent;margin:0 auto;cursor:pointer;flex:none;position:relative}
.cam .shoot::after{content:"";position:absolute;inset:6px;border-radius:50%;background:#ECE8E0;transition:transform .12s}
.cam .shoot:active::after{transform:scale(.88)}
.cam .hint{position:absolute;z-index:2;top:calc(14px + env(safe-area-inset-top,0));left:14px;right:14px;padding:10px 12px;border-radius:10px;background:rgba(5,6,6,.6);border:1px solid rgba(236,232,224,.12);color:#ECE8E0;text-align:center;font-size:14px}
.cam .hint small{display:block;margin-top:4px;font:500 12px/1.35 var(--sans);letter-spacing:0;color:#B08D57}

/* ---------- result: the stamp ---------- */
.res{text-align:center;padding:40px 18px 26px}
.stamp{display:inline-block;padding:14px 22px;border:2px solid var(--c,var(--bronze));color:var(--c,var(--bronze));font:600 12px/1.35 var(--sans);letter-spacing:0;transform:rotate(-4deg);box-shadow:0 0 0 5px color-mix(in srgb,var(--c,var(--bronze)) 9%,transparent);animation:stamp .55s var(--ease) .1s backwards}
@keyframes stamp{0%{opacity:0;transform:rotate(-9deg) scale(1.8)}}
.res.ok{--c:var(--sage)}.res.pend{--c:var(--gold)}.res.off{--c:var(--cyan)}.res.bad{--c:var(--red)}.res.send{--c:var(--mute)}
.res .when{font-size:52px;line-height:1;font-weight:500;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin:26px 0 6px}
.res h2{font-size:19px;font-weight:600;margin:0}
.res img{width:120px;height:150px;object-fit:cover;border-radius:12px;margin-top:20px;border:1px solid var(--line2)}
.spin{width:30px;height:30px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--bronze);animation:rot .8s linear infinite;margin:0 auto}
@keyframes rot{to{transform:rotate(360deg)}}

/* ---------- month ---------- */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:var(--r2);background:var(--s1);margin-bottom:12px}
.tile{padding:12px 10px;border-inline-start:1px solid var(--line)}.tile:first-child{border-inline-start:0}
.tile b{display:block;font-size:24px;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile span{display:block;margin-top:3px;font:500 12px/1.35 var(--sans);letter-spacing:0;color:var(--mute)}
.tile.P b{color:var(--sage)}.tile.A b{color:var(--red)}.tile.L b{color:var(--gold)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{text-align:center;padding-bottom:4px;font:500 9.5px var(--mono);font-stretch:75%;letter-spacing:.14em;color:var(--faint)}
.cal .d{position:relative;aspect-ratio:1;border-radius:9px;border:1px solid var(--line);background:var(--s2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:500 8.5px var(--mono);font-stretch:75%;letter-spacing:.08em;color:var(--mute)}
.cal .d b{font:500 14px var(--sans);font-variant-numeric:tabular-nums;color:var(--ink2)}
.cal .d.P,.cal .d.R{border-color:color-mix(in srgb,var(--sage) 45%,transparent);background:var(--sage-bg);color:var(--sage)}
.cal .d.A{border-color:color-mix(in srgb,var(--red) 45%,transparent);background:var(--red-bg);color:var(--red)}
.cal .d.OFF,.cal .d.O{background:var(--s3)}
.cal .d.AL,.cal .d.SL,.cal .d.EL,.cal .d.UL{border-color:color-mix(in srgb,var(--gold) 45%,transparent);background:var(--gold-bg);color:var(--gold)}
.cal .d.today{outline:1.5px solid var(--bronze);outline-offset:1px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:7px;font:500 12px/1.35 var(--sans);letter-spacing:0;color:var(--mute)}
.legend i{width:8px;height:8px;border-radius:50%}

/* ---------- more ---------- */
.menu-list{margin:0;padding:0;list-style:none}
.menu-list button{display:flex;width:100%;gap:14px;align-items:center;border:0;border-top:1px solid var(--line);background:none;padding:0 2px;min-height:58px;font:400 15.5px var(--sans);text-align:start;cursor:pointer;color:var(--ink)}
.menu-list li:first-child button{border-top:0}
.menu-list svg.i{color:var(--mute)}
.menu-list .val{margin-inline-start:auto;font:500 12px/1.35 var(--sans);letter-spacing:0;color:var(--mute)}
.menu-list .danger{color:var(--red)}.menu-list .danger svg.i{color:var(--red)}

/* ---------- supervisor ---------- */
.chips{display:flex;gap:6px;overflow-x:auto;margin:14px -2px 0;padding:0 2px 2px;scrollbar-width:none}
.chips button{flex:none;display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line2);background:transparent;border-radius:var(--r);padding:0 12px;min-height:38px;font:500 12px/1.35 var(--sans);letter-spacing:0;color:var(--mute);cursor:pointer}
.chips button b{font-weight:600;color:var(--ink2)}
.chips button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}.chips button.on b{color:var(--bg)}
.srch{position:relative;margin-top:10px}.srch svg.i{position:absolute;inset-inline-start:14px;top:50%;margin-top:-9px;color:var(--mute)}
.srch input{padding-inline-start:42px!important}
.sup li{flex-wrap:wrap}
.sup .av{position:relative;width:38px;height:38px;border-radius:10px;border:1px solid var(--line2);color:var(--ink2);display:grid;place-items:center;font:600 11px var(--mono);letter-spacing:.06em;flex:none}
.sup .av i{position:absolute;right:-3px;bottom:-3px;width:10px;height:10px;border-radius:50%;border:2px solid var(--s1);background:var(--faint)}
.sup .av i.in{background:var(--sage)}.sup .av i.done{background:var(--cyan)}.sup .av i.none{background:var(--gold)}.sup .av i.marked{background:var(--ink2)}
.sup .acts{display:flex;gap:8px;width:100%;padding-inline-start:50px}
.sup .acts select{flex:1;min-height:44px;padding-top:6px;padding-bottom:6px;font-size:14px}
.sup .acts .btn{min-height:44px;padding:0 14px}

/* ---------- avatar / identity ---------- */
.who{display:flex;gap:12px;align-items:center}
.who .av{width:42px;height:42px;border-radius:12px;border:1px solid var(--bronze);color:var(--bronze);display:grid;place-items:center;font:600 12px var(--mono);letter-spacing:.06em;flex:none}
.who b{display:block;font-size:17px;font-weight:600;letter-spacing:-.01em;line-height:1.2}

/* ---------- sheets, toast ---------- */
.sheet-menu{position:fixed;inset:0;background:rgba(5,6,6,.6);z-index:2100;display:flex;align-items:flex-end;animation:fade .15s}
.sheet-menu .in{background:var(--s1);border-top:1px solid var(--line2);width:100%;border-radius:20px 20px 0 0;padding:8px 16px calc(16px + env(safe-area-inset-bottom,0));max-width:560px;margin:0 auto;animation:up .25s var(--ease)}
.sheet-menu .in::before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:var(--line3);margin:4px auto 10px}
.sheet-menu button{display:flex;width:100%;gap:14px;align-items:center;justify-content:space-between;border:0;border-top:1px solid var(--line);background:none;padding:0 4px;min-height:56px;font:400 16px var(--sans);text-align:start;cursor:pointer;color:var(--ink)}
.sheet-menu button:first-child{border-top:0}
.sheet-menu button.on{color:var(--bronze)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(var(--tab) + var(--dock) + 14px + env(safe-area-inset-bottom,0));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:2200;max-width:92vw;text-align:center}
.toast.show{opacity:1}
body.notabs .toast{bottom:calc(24px + env(safe-area-inset-bottom,0))}
[dir=rtl] .k-side{text-align:start}

/* Leaflet in the instrument */
.leaflet-container{user-select:none;-webkit-user-select:none;font-family:var(--sans);background:var(--s2)!important}
.leaflet-control-attribution{font-size:8.5px;background:color-mix(in srgb,var(--bg) 70%,transparent)!important;color:var(--mute)!important}
.leaflet-control-attribution a{color:var(--ink2)!important}
.leaflet-tooltip{background:var(--s1);color:var(--ink);border:1px solid var(--line2);box-shadow:none;font:500 12px/1.35 var(--sans);letter-spacing:0}
.leaflet-tooltip-top::before{border-top-color:var(--line2)}

@media (max-width:380px){
  main{padding-left:12px;padding-right:12px;padding-top:14px}
  .place .n{font-size:26px}
  .k-time{font-size:38px}
  .k-side b{font-size:16px}
  .clockw{gap:10px;padding:14px 12px 12px}
  .liverow b{font-size:18px}
  .liverow>div{padding:10px 8px}
  #map{height:clamp(180px,28vh,300px)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* =========================================================================
   Proportion pass: one type scale (12 · 13 · 15 · 17 · 22 · 32), 8-pt spacing,
   sentence-case labels, controls sized to the content.
   ========================================================================= */
:root{--r:10px;--r2:14px;--tab:58px;--dock:72px}
body{font-size:15px;line-height:1.45}
.k,.lbl{font:500 12px/1.35 var(--sans);letter-spacing:0;text-transform:none;color:var(--mute)}
.lbl{margin:0 0 8px;color:var(--ink2);font-weight:600;font-size:13px}
.note{font-size:12px;margin:12px 2px 0}
main{padding:16px 16px calc(var(--tab) + var(--dock) + 16px + env(safe-area-inset-bottom,0))}
.card{padding:14px;margin-bottom:12px}

/* header */
.top{min-height:52px;gap:8px;padding-left:16px;padding-right:12px}
.top .mark{width:26px;height:26px;border-radius:7px;font-size:10px}
.crumb{font:500 13px var(--sans);letter-spacing:0;text-transform:none}
.crumb span::after{margin:0 .45em}
.ib{height:36px;min-width:36px;padding:0 8px;border-color:transparent;font:600 12px var(--sans);letter-spacing:0;text-transform:none}
.ib svg.i{width:18px;height:18px}
.synthetic{padding:6px 16px;font-size:12px;letter-spacing:0;text-transform:none}

/* identity */
.place{margin:4px 2px 14px}
.place .n{font-size:22px;line-height:1.2;font-weight:650;letter-spacing:-.01em;font-stretch:100%}
.place .n em{font-style:normal;font-weight:400;color:var(--ink2)}
.place .z{margin-top:4px;font:400 13px var(--sans);letter-spacing:0;text-transform:none}
.place .z b{font-weight:600}

/* clock */
.clockw{gap:4px 12px;padding:14px;margin-bottom:12px}
.k-stack{gap:1px;font:600 10px var(--sans);letter-spacing:.04em}
.k-time{font-size:32px;font-weight:600;letter-spacing:-.02em;font-stretch:100%}
.k-side .k{font-size:12px}
.k-side b{font:600 17px var(--sans);margin-top:2px}
.k-rule{margin-top:10px}
.k-ends{margin-top:6px}.k-ends .k{font-size:11px;font-variant-numeric:tabular-nums}

/* readouts: 3 equal cells, value + one-line label */
.liverow{grid-template-columns:repeat(3,1fr);margin-bottom:12px}
.liverow>div{padding:10px 12px}
.liverow>div.opt{display:none}
.liverow b{font-size:17px;font-weight:600;letter-spacing:-.01em}
.liverow span{margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* verdict */
#gps{margin-bottom:12px}
.conf{padding:10px 12px;gap:10px;font-size:13px}
.chip,.pill{padding:3px 8px;font:600 11px var(--sans);letter-spacing:0;text-transform:none;border-radius:6px}

/* map */
#map{height:clamp(180px,26vh,280px)}
.mapcard .modechip{top:8px;inset-inline-start:8px}
.mapcard .tools{inset-inline-end:8px;bottom:26px;gap:6px}
.mapcard .tools button{width:36px;height:36px;border-radius:9px}
.mapcard .tools svg.i{width:16px;height:16px}
.mapcard .cap{font-size:11px;letter-spacing:0;text-transform:none;bottom:6px;inset-inline-start:8px}
.modechip,.seg{padding:2px;border-radius:9px}
.modechip button,.seg button{min-height:36px;padding:0 12px;font:600 12px var(--sans);letter-spacing:0;text-transform:none;border-radius:7px}
.seg button{min-height:36px}

/* the action */
.dock{padding:8px 16px 10px}
.big{min-height:52px;padding:0 16px;border-radius:12px;gap:12px}
.big .lab{font:650 15px var(--sans);letter-spacing:0;text-transform:none}
.big small{font-size:12px;margin-top:1px}
.big svg.i{width:20px;height:20px}
.big.out .lab::before{width:6px;height:6px;margin-inline-end:8px;vertical-align:2px}

/* timeline */
.list li{padding:10px 0;min-height:48px;gap:10px;font-size:14px}
.list .tm{font:600 13px var(--sans);font-variant-numeric:tabular-nums;min-width:42px}
.list .ev{width:26px;height:26px;border-radius:7px}
.list .what{font-weight:500;font-size:14px}.list .sub{font-size:12px}

/* tabs */
.tabs-b button{gap:3px;font:500 11px var(--sans);letter-spacing:0;text-transform:none}
.tabs-b button svg.i{width:20px;height:20px}
.tabs-b button.on{font-weight:650}

/* buttons, fields */
.btn{min-height:46px;padding:0 16px;font:600 15px var(--sans);letter-spacing:0;text-transform:none}
input.f,select.f{min-height:48px;padding:10px 12px;font-size:16px}
input.f.mono{font:600 17px var(--sans);letter-spacing:.04em;font-variant-numeric:tabular-nums}
label.fl{margin:12px 0 6px;font:500 12px var(--sans);letter-spacing:0;text-transform:none;color:var(--ink2)}

/* sign in */
.hero{padding:20px 2px 16px}
.hero .kick{font:600 12px var(--sans);letter-spacing:0;text-transform:none;margin-bottom:8px}
.hero h1{font-size:28px;font-weight:650;letter-spacing:-.02em;line-height:1.15;font-stretch:100%}
.hero h1 em{font-style:normal;font-weight:400}
.hero p{font-size:14px;margin-top:6px}
.idchip{font:600 15px var(--sans);letter-spacing:.04em;padding:4px 4px 4px 12px}
.idchip button{min-height:36px;font:500 12px var(--sans);letter-spacing:0;text-transform:none}
.dots{gap:16px;margin:18px 0 8px}
.pad{gap:10px;max-width:320px}
.pad button{height:56px;border-radius:12px;font-size:22px;font-weight:500}
.err{font:500 13px var(--sans);letter-spacing:0;text-transform:none}

/* result */
.res{padding:32px 16px 20px}
.stamp{padding:10px 18px;font:700 13px var(--mono);letter-spacing:.22em}
.res .when{font-size:32px;font-weight:600;letter-spacing:-.02em;margin:22px 0 4px}
.res h2{font-size:17px}
.res img{width:96px;height:120px;margin-top:16px}

/* month */
.tiles{margin-bottom:12px}
.tile{padding:10px 12px}
.tile b{font-size:22px;font-weight:600}
.tile span{font:400 12px var(--sans);letter-spacing:0;text-transform:none}
.cal{gap:4px}
.cal .h{font:500 11px var(--sans);letter-spacing:0}
.cal .d{border-radius:8px;font:600 9px var(--sans);letter-spacing:0;gap:0}
.cal .d b{font-size:13px;font-weight:500}
.legend{gap:12px;margin-top:10px}
.legend span{font:400 12px var(--sans);letter-spacing:0;text-transform:none}

/* more, supervisor, sheets */
.menu-list button{min-height:52px;font-size:15px}
.menu-list .val{font:400 13px var(--sans);letter-spacing:0;text-transform:none}
.chips button{min-height:36px;font:600 12px var(--sans);letter-spacing:0;text-transform:none}
.sup .av,.who .av{font:600 12px var(--sans);letter-spacing:0}
.sheet-menu button{min-height:52px;font-size:15px}
.cam .hint small{font:500 12px var(--sans);letter-spacing:0;text-transform:none}
.leaflet-tooltip{font:600 11px var(--sans);letter-spacing:0;text-transform:none}

@media (max-width:380px){
  main{padding-left:12px;padding-right:12px}
  .place .n{font-size:20px}
  .k-time{font-size:28px}
  .k-side b{font-size:15px}
  .liverow b{font-size:16px}
  .liverow>div{padding:9px 10px}
  #map{height:clamp(160px,24vh,240px)}
  .pad button{height:52px}
}

/* camera: whole screen, no face guide */
.cam .oval{display:none}
/* taller map */
#map{height:clamp(300px,46vh,520px)}
@media (max-width:380px){#map{height:clamp(240px,40vh,400px)}}
/* check in / check out: unmistakable – solid green to start, solid red to finish */
:root{--dock:88px;--go:#2F9E5B;--stop:#D0473A}
:root[data-theme=light]{--go:#23824A;--stop:#B8372B}
@media (prefers-color-scheme:light){:root:not([data-theme]){--go:#23824A;--stop:#B8372B}}
.dock{padding:10px 16px 12px}
.big{min-height:68px;padding:0 16px;border-radius:16px;gap:14px;border:0;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.big .bi{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
.big .bi svg.i{width:24px;height:24px;margin:0;stroke-width:2}
.big .lab{font:700 20px/1.15 var(--sans);letter-spacing:.01em;text-transform:uppercase}
.big small{font-size:12.5px;opacity:.9;margin-top:2px}
.big>svg.i{width:22px;height:22px;stroke-width:2}
.big.in{background:var(--go);color:#fff}
.big.out{background:var(--stop);color:#fff;border:0}
.big.out .lab::before{display:none}
.cam .ctl{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.cam .ctl .shoot{margin:0}
.cam .ctl:has([data-u]){display:flex}

/* camera: show the whole frame (no crop = no "zoom"), mirrored like a normal selfie camera; the saved photo is not mirrored */
.cam video{object-fit:contain;transform:scaleX(-1)}
.cam .shoot:disabled{opacity:.35}
/* get the app: Android APK link / iPhone Add to Home Screen */
.getapp{display:flex;align-items:center;gap:10px;margin:12px 0 0;padding:12px 14px;border-radius:12px;border:1px solid var(--line2);background:var(--s1);color:var(--ink);font:500 14px/1.35 var(--sans);text-decoration:none;min-height:44px}
.getapp svg.i{flex:none;width:20px;height:20px;color:var(--bronze)}
a.getapp{border-color:var(--bronze)}
/* tour of the Today screen (only when ? is tapped) */
.tour-hole{position:fixed;z-index:3000;border-radius:14px;box-shadow:0 0 0 9999px rgba(0,0,0,.62);outline:2px solid var(--bronze);transition:top .55s cubic-bezier(.4,0,.2,1),left .55s cubic-bezier(.4,0,.2,1),width .55s cubic-bezier(.4,0,.2,1),height .55s cubic-bezier(.4,0,.2,1)}
.tour-tip{transition:top .35s ease}
.tour-tip{position:fixed;z-index:3001;left:16px;right:16px;background:var(--s1);color:var(--ink);border:1px solid var(--line2);border-radius:14px;padding:14px 16px 12px;box-shadow:0 14px 34px rgba(0,0,0,.4);font:400 14px/1.45 var(--sans)}
.tour-tip>b{display:block;font:600 16px/1.3 var(--sans);margin:2px 0 4px}
.tour-tip p{margin:0 0 12px;color:var(--ink2,var(--ink))}
.tour-tip .tour-n{font:500 12px var(--sans);color:var(--mute)}
.tour-tip .tour-b{display:flex;gap:8px;align-items:center}
.tour-tip .tour-b .btn{min-width:56px;min-height:44px}
[dir=rtl] .tour-tip .tour-b svg{transform:scaleX(-1)}
[dir=rtl] .tour-tip .tour-n{text-align:right}
/* patrol card */
.patrol{margin:12px 0 0;padding:14px 16px;border:1px solid var(--line2);border-radius:16px;background:var(--s1)}
.patrol>.k{font:500 12px var(--sans);color:var(--mute);margin-bottom:6px}
.patrol .pb{padding:8px 0;border-bottom:1px solid var(--line)}
.patrol .pb b{font:600 16px/1.3 var(--sans)}.patrol .pb span{display:block;font:400 13px var(--sans);color:var(--ink)}
.patrol .pb small{display:block;font:400 12px/1.4 var(--sans);color:var(--mute);margin-top:2px}.patrol .pb small b{font-size:12px;color:var(--ink)}
.patrol .bar{height:6px;border-radius:3px;background:var(--s3);margin-top:8px;overflow:hidden}.patrol .bar i{display:block;height:100%;background:var(--go,#2F9E5B)}
.patrol #b-scan{margin-top:12px;min-height:48px}
.cam.qr video{object-fit:cover;transform:none}
.cam .qrframe{position:absolute;left:50%;top:45%;width:min(64vw,280px);aspect-ratio:1;transform:translate(-50%,-50%);border:3px solid #fff;border-radius:18px;box-shadow:0 0 0 200vmax rgba(0,0,0,.45);pointer-events:none}

<body>
<div id="app"></div>
<div class="toast" id="toast" role="status"></div>
<script>
'use strict';
/* =====================================================================
   LS worker-attendance API core.
   One file, three hosts: Azure Functions (Node 20), the local dev server,
   and the in-browser demo mode of both HTML pages. Pure logic over a
   small storage interface; crypto is WebCrypto (browser + Node 20).
   ===================================================================== */
const LSAPI = (() => {
  const enc = new TextEncoder();
  const b64u = buf => { let s = ''; const a = new Uint8Array(buf); for (let i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
  const unb64u = s => { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; const b = atob(s); const a = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; };
  const hex = buf => [...new Uint8Array(buf)].map(x => x.toString(16).padStart(2, '0')).join('');
  const subtle = () => globalThis.crypto.subtle;
  const rid = () => hex(globalThis.crypto.getRandomValues(new Uint8Array(9)));

  /** PBKDF2-SHA256, 100k rounds. The admin tracker hashes the PIN; the server only ever sees hash + salt. */
  async function hashPin(pin, saltHex) {
    const salt = saltHex || hex(globalThis.crypto.getRandomValues(new Uint8Array(16)));
    const key = await subtle().importKey('raw', enc.encode(String(pin)), 'PBKDF2', false, ['deriveBits']);
    const bits = await subtle().deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: enc.encode(salt), iterations: 100000 }, key, 256);
    return { hash: hex(bits), salt };
  }
  async function hmac(secret, data) {
    const key = await subtle().importKey('raw', enc.encode(secret), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
    return b64u(await subtle().sign('HMAC', key, enc.encode(data)));
  }
  async function signToken(secret, payload) { const body = b64u(enc.encode(JSON.stringify(payload))); return body + '.' + await hmac(secret, body); }
  async function readToken(secret, tok, now) {
    if (!tok || !tok.includes('.')) return null;
    const [body, sig] = tok.split('.');
    if (await hmac(secret, body) !== sig) return null;
    const p = JSON.parse(new TextDecoder().decode(unb64u(body)));
    return p.exp > now ? p : null;
  }

  /* ---------- geo ---------- */
  const R = 6371000, rad = x => x * Math.PI / 180;
  function distance(a, b) {
    const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }
  /** Nearest pin of a site to a point: { d, pin, inZone } — in zone when (distance − accuracy) ≤ radius */
  function nearestPin(site, pt, acc) {
    let best = null;
    for (const pin of site?.pins || []) {
      const d = distance(pt, pin); const r = +pin.radius || 100;
      const x = { d: Math.round(d), pin, radius: r, inZone: d - (acc || 0) <= r };
      if (!best || x.d - x.radius < best.d - best.radius) best = x;
    }
    return best;
  }

  /* ---------- dates: all work dates are Dubai time (UTC+4, no DST) ---------- */
  const DXB = 4 * 3600000;
  const dxbISO = t => new Date(t + DXB).toISOString();                 // "2026-07-01T07:03:00.000Z" read as local Dubai time
  const dxbDate = t => dxbISO(t).slice(0, 10);
  const dxbMin = t => { const s = dxbISO(t); return +s.slice(11, 13) * 60 + +s.slice(14, 16); };
  const hm = s => { const [h, m] = String(s || '0:0').split(':').map(Number); return h * 60 + (m || 0); };

  /** Codes a supervisor may give a day with no check-in (the tracker's own codes) */
  const MARK_CODES = [['A', 'Absent'], ['OFF', 'Day off'], ['SL', 'Sick leave'], ['AL', 'Annual leave'], ['EL', 'Emergency leave'], ['UL', 'Unpaid leave'], ['SIRA', 'SIRA exam / training'], ['P', 'Present – no phone (supervisor confirms)']];
  const DEFAULTS = { radius: 100, maxAcc: 50, windowMin: 60, lateMin: 15, photo: true, bindDevice: true, dupMin: 30, shiftHours: 12, starts: { DAY: '07:00', NIGHT: '19:00' }, lockTries: 5, lockMin: 15, tokenHours: 20 };

  /**
   * store: { get(t, id), put(t, obj), list(t, filterFn?, hint?), del(t, id),   hint = { wid, code, since, fromDate, workDate, clientId, enabled }; tables: workers, sites, punches, marks, pings, scans, config lets a server store filter before the scan; putBlob(name, bytes, type), getBlob(name) → {bytes, type} }
   * opts: { store, secret, now: () => ms }
   */
  function create({ store, secret, now = () => Date.now() }) {
    const J = (status, body) => ({ status, body });
    const err = (status, msg, code) => J(status, { error: msg, code: code || status });
    const cfg = async () => ({ ...DEFAULTS, ...((await store.get('config', 'app'))?.v || {}) });

    async function worker(req) {
      const tok = (req.headers?.authorization || '').replace(/^Bearer /i, '');
      const p = await readToken(secret, tok, now()); if (!p) return null;
      const w = await store.get('workers', p.sub); if (!w || !w.enabled) return null;
      if (w.deviceId && p.dev !== w.deviceId) return null;
      return w;
    }
    const roles = req => req.principal?.userRoles || [];
    const isAdmin = req => roles(req).includes('admin');
    const isSup = req => isAdmin(req) || roles(req).includes('supervisor');
    const isViewer = req => isSup(req) || roles(req).includes('viewer');
    const me = req => String(req.principal?.userDetails || '').toLowerCase();
    const byCode = async code => { const c = String(code || '').trim().toUpperCase(); return (await store.list('workers', w => w.code === c, { code: c }))[0] || null; };

    const cleanBeats = bs => (Array.isArray(bs) ? bs : []).slice(0, 50).map(b => ({ id: String(b.id), name: String(b.name || '').slice(0, 60), shift: ['DAY', 'NIGHT'].includes(b.shift) ? b.shift : 'ALL', everyMin: Math.max(10, +b.everyMin || 60), assignees: (b.assignees || []).map(String).slice(0, 500),
      checkpoints: (b.checkpoints || []).slice(0, 100).map(c => ({ id: String(c.id), name: String(c.name || '').slice(0, 60), lat: +c.lat, lng: +c.lng, radius: Math.max(5, +c.radius || 25) })) }));
    const DOC_TYPES = ['ATT', 'VEH', 'SVR', 'MPR', 'MED'];
    async function saveDoc(w, b, by) {
      const type = String(b.type || '').toUpperCase(), pages = Array.isArray(b.pages) ? b.pages : [];
      if (!DOC_TYPES.includes(type)) return err(400, 'Unknown report type');
      if (!pages.length || pages.length > 80) return err(400, 'Send 1 to 80 pages');
      const ym = /^\d{4}-\d\d$/.test(b.ym || '') ? b.ym : dxbDate(now()).slice(0, 7);
      if (b.clientId) { const old = (await store.list('docs', x => x.clientId === String(b.clientId) && x.code === w.code, { clientId: String(b.clientId) }))[0]; if (old) return J(200, { doc: old, repeat: true }); }
      const id = rid();
      for (let i = 0; i < pages.length; i++) {
        const m2 = String(pages[i]).match(/^data:(image\/(?:jpeg|png));base64,(.*)$/); if (!m2 || m2[2].length > 2.8e6) return err(400, `Page ${i + 1} is not a photo (or is too large)`);
        await store.putBlob(`docs/${ym}/${id}_${i}.jpg`, unb64u(m2[2].replace(/\+/g, '-').replace(/\//g, '_')), m2[1]);
      }
      const doc = { id, code: w.code, wid: w.id, name: w.name, type, ym, pages: pages.length, by: String(by || '').slice(0, 120), at: new Date(now()).toISOString(), serverTs: now(), clientId: String(b.clientId || '') };
      await store.put('docs', doc); return J(200, { doc });
    }
    async function profile(w) {
      const c = await cfg(), t = now(), today = dxbDate(t);
      const sites = await store.list('sites');
      const mine = await store.list('punches', p => p.wid === w.id && p.workDate >= addDays(today, -1), { wid: w.id, fromDate: addDays(today, -1) });
      const open = [...mine].filter(p => p.type === 'in' && !p.outId && p.status !== 'rejected' && t - p.ts < 18 * 3600000).sort((a, b) => b.ts - a.ts)[0] || null;
      return {
        worker: { id: w.id, code: w.code, name: w.name, shift: w.shift, siteId: w.siteId, trade: w.trade || '' },
        site: sites.find(s => s.id === w.siteId) || null,
        sites: sites.filter(s => s.pins?.length).map(s => ({ id: s.id, name: s.name, project: s.project, pins: s.pins })),
        settings: { radius: c.radius, maxAcc: c.maxAcc, photo: c.photo, windowMin: c.windowMin, starts: c.starts, shiftHours: c.shiftHours },
        today, punches: mine.map(strip).sort((a, b) => a.ts - b.ts), open: open && strip(open),
        months: w.months || {}
      };
    }
    const strip = p => { const { photo, ...r } = p; return { ...r, hasPhoto: !!photo }; };
    const addDays = (iso, n) => { const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };

    /** The core punch rule, shared by worker and supervisor punches */
    async function doPunch(w, b, by) {
      const c = await cfg(), t = now();
      const type = b.type === 'out' ? 'out' : b.type === 'in' ? 'in' : null; if (!type) return err(400, 'type must be in or out');
      const lat = +b.lat, lng = +b.lng, acc = Math.round(+b.acc || 0);
      if (!isFinite(lat) || !isFinite(lng) || Math.abs(lat) > 90 || Math.abs(lng) > 180) return err(400, 'Location missing – allow location and try again', 'NO_GPS');
      if (c.photo && !b.photo) return err(400, 'Photo required', 'NO_PHOTO');
      if (b.photo && b.photo.length > 900000) return err(413, 'Photo too large');
      if (b.clientId) { const dup = (await store.list('punches', p => p.clientId === b.clientId && p.wid === w.id, { wid: w.id, clientId: b.clientId }))[0]; if (dup) return J(200, { punch: strip(dup), repeat: true }); }
      // device time: queued offline punches keep their own time, never one in the future
      let ts = +new Date(b.ts || t); const flags = [];
      if (!isFinite(ts) || ts > t + 5 * 60000) { ts = t; flags.push('clock'); }
      if (t - ts > 5 * 60000) flags.push('offline');
      if (t - ts > 72 * 3600000) return err(400, 'Punch older than 72 hours – ask your supervisor');
      const mine = await store.list('punches', p => p.wid === w.id && Math.abs(p.ts - ts) < 20 * 3600000 && p.status !== 'rejected', { wid: w.id, fromDate: addDays(dxbDate(ts), -1) });
      const lastSame = mine.filter(p => p.type === type).sort((a, b) => b.ts - a.ts)[0];
      if (lastSame && Math.abs(ts - lastSame.ts) < c.dupMin * 60000) return err(409, `Already marked ${type === 'in' ? 'check-in' : 'check-out'} at ${dxbISO(lastSame.ts).slice(11, 16)}`, 'DUPLICATE');
      // geofence: assigned site first, then any site (reliever)
      const sites = await store.list('sites');
      const assigned = sites.find(s => s.id === w.siteId);
      const pt = { lat, lng };
      let match = assigned ? nearestPin(assigned, pt, acc) : null, site = assigned, reliever = false;
      if (!match?.inZone) {
        const other = sites.filter(s => s.id !== w.siteId).map(s => ({ s, m: nearestPin(s, pt, acc) })).filter(x => x.m?.inZone).sort((a, b) => a.m.d - b.m.d)[0];
        if (other) { site = other.s; match = other.m; reliever = true; }
      }
      const reasons = [];
      if (!assigned?.pins?.length && !reliever) reasons.push('site has no location pin');
      else if (!match?.inZone) reasons.push(`outside zone – ${match ? match.d + ' m from ' + (site?.name || 'site') : 'no site nearby'}`);
      if (acc > c.maxAcc) reasons.push(`GPS accuracy ±${acc} m (limit ${c.maxAcc} m)`);
      if (flags.includes('clock')) reasons.push('phone clock ahead of server');
      // pairing, work date and hours
      let workDate = dxbDate(ts), inP = null, hours = null;
      if (type === 'out') {
        inP = mine.filter(p => p.type === 'in' && !p.outId && p.ts < ts && ts - p.ts < 18 * 3600000).sort((a, b) => b.ts - a.ts)[0] || null;
        if (inP) { workDate = inP.workDate; hours = Math.round((ts - inP.ts) / 36000) / 100; } else reasons.push('no check-in found');
      }
      const shift = w.shift || 'DAY', start = hm(c.starts[shift] || '07:00'), m = dxbMin(ts);
      if (type === 'in') {
        let late = m - start; if (late < -720) late += 1440; if (late > 720) late -= 1440;
        if (late > c.lateMin) flags.push('late ' + late + ' min');
        if (late < -c.windowMin) reasons.push(`too early – check-in opens ${c.windowMin} min before ${c.starts[shift]}`);
        if (shift === 'NIGHT' && m < 12 * 60) workDate = addDays(workDate, -1);   // night shift started after midnight → belongs to the previous date
      } else if (inP && hours < c.shiftHours - c.lateMin / 60) flags.push('early leave');
      const id = rid();
      let photo = '';
      if (b.photo) { const m2 = String(b.photo).match(/^data:(image\/[a-z]+);base64,(.*)$/); if (m2) { photo = `photos/${workDate.slice(0, 7)}/${id}.jpg`; await store.putBlob(photo, unb64u(m2[2].replace(/\+/g, '-').replace(/\//g, '_')), m2[1]); } }
      const punch = { id, wid: w.id, code: w.code, name: w.name, type, ts, serverTs: t, workDate, lat, lng, acc, siteId: site?.id || '', siteName: site?.name || '', assignedSiteId: w.siteId || '', dist: match ? match.d : null, radius: match?.radius || null, inZone: !!match?.inZone, reliever, status: reasons.length ? 'pending' : 'accepted', reasons, flags, photo, clientId: b.clientId || '', deviceId: b.deviceId || '', by: by || 'worker', inId: inP?.id || '', hours, shift };
      await store.put('punches', punch);
      if (inP) { inP.outId = id; inP.serverTs = t; await store.put('punches', inP); }
      return J(200, { punch: strip(punch) });
    }

    const routes = {
      /* ---------- worker ---------- */
      'POST worker/login': async req => {
        const c = await cfg(), b = req.body || {};
        const w = await byCode(b.code); if (!w || !w.enabled) return err(403, 'This ID is not enabled for the app – ask your supervisor', 'NOT_ENABLED');
        if (w.lockUntil > now()) return err(423, `Too many wrong PINs – try again after ${dxbISO(w.lockUntil).slice(11, 16)}`, 'LOCKED');
        const h = await hashPin(b.pin, w.pinSalt);
        if (!w.pinHash || h.hash !== w.pinHash) {
          w.fails = (w.fails || 0) + 1; if (w.fails >= c.lockTries) { w.lockUntil = now() + c.lockMin * 60000; w.fails = 0; }
          await store.put('workers', w); return err(401, 'Wrong PIN', 'BAD_PIN');
        }
        if (c.bindDevice && w.deviceId && b.deviceId && w.deviceId !== b.deviceId) return err(403, 'This ID is registered on another phone – ask admin to reset the device', 'OTHER_DEVICE');
        w.fails = 0; w.lockUntil = 0; if (!w.deviceId && b.deviceId) w.deviceId = b.deviceId; w.lastLogin = now();
        await store.put('workers', w);
        const token = await signToken(secret, { sub: w.id, dev: w.deviceId || '', exp: now() + c.tokenHours * 3600000 });
        return J(200, { token, ...(await profile(w)) });
      },
      'GET worker/me': async req => { const w = await worker(req); return w ? J(200, await profile(w)) : err(401, 'Please sign in again', 'AUTH'); },
      'POST worker/punch': async req => { const w = await worker(req); if (!w) return err(401, 'Please sign in again', 'AUTH'); return doPunch(w, req.body || {}, 'worker'); },
      // positions while a shift is open (phone app on screen): routes and hotspots in the tracker's Insights
      'POST worker/ping': async req => {
        const w = await worker(req); if (!w) return err(401, 'Please sign in again', 'AUTH');
        const t = now(), pts = (Array.isArray(req.body?.pts) ? req.body.pts : []).slice(0, 100);
        let n = 0;
        for (const x of pts) {
          const lat = +x.lat, lng = +x.lng, ts = +x.ts;
          if (!isFinite(lat) || !isFinite(lng) || Math.abs(lat) > 90 || Math.abs(lng) > 180 || !(ts > t - 72 * 3600000 && ts < t + 300000)) continue;
          await store.put('pings', { id: w.id + '-' + ts, wid: w.id, code: w.code, ts, lat, lng, acc: Math.round(+x.acc || 0), serverTs: t }); n++;
        }
        return J(200, { saved: n });
      },
      // patrol checkpoint scanned on the phone (QR "LSCP|siteId|checkpointId"), GPS-checked against the checkpoint
      'POST worker/scan': async req => {
        const w = await worker(req); if (!w) return err(401, 'Please sign in again', 'AUTH');
        const b = req.body || {}, m = String(b.code || '').match(/^LSCP\|([^|]+)\|([^|]+)$/); if (!m) return err(400, 'Not an LS checkpoint code', 'BAD_CODE');
        const site = await store.get('sites', m[1]); let beat = null, cp = null;
        for (const x of site?.beats || []) { const c = (x.checkpoints || []).find(c => c.id === m[2]); if (c) { beat = x; cp = c; break; } }
        if (!cp) return err(404, 'Checkpoint not found – ask the admin to publish the roster', 'NO_CHECKPOINT');
        const t = now(), lat = +b.lat, lng = +b.lng, acc = Math.round(+b.acc || 0), ts = Math.min(+b.ts || t, t);
        if (b.clientId) { const dup = (await store.list('scans', x => x.clientId === b.clientId, { clientId: b.clientId }))[0]; if (dup) return J(200, { scan: dup, repeat: true }); }
        const has = isFinite(lat) && isFinite(lng) && Math.abs(lat) <= 90 && lat !== 0;
        const dist = has ? distance({ lat, lng }, cp) : null, ok = has && dist - Math.min(acc, 50) <= (+cp.radius || 25) + 30;
        const scan = { id: rid(), personId: w.id, code: w.code, name: w.name, siteId: site.id, beatId: beat.id, checkpointId: cp.id, checkpoint: cp.name, beat: beat.name, ts, lat: has ? lat : null, lng: has ? lng : null, acc, dist, ok, clientId: b.clientId || '', serverTs: t };
        await store.put('scans', scan); return J(200, { scan });
      },
      /* ---------- supervisor ---------- */
      'GET supervisor/board': async req => {
        if (!isSup(req)) return err(403, 'Supervisor role required');
        const today = dxbDate(now()), site = req.query?.site || '';
        const ws = await store.list('workers', w => w.enabled && (!site || w.siteId === site), { enabled: true });
        const ps = await store.list('punches', p => p.workDate === today && p.status !== 'rejected', { workDate: today });
        const date = /^\d{4}-\d{2}-\d{2}$/.test(req.query?.date || '') ? req.query.date : today;
        const ps2 = date === today ? ps : await store.list('punches', p => p.workDate === date && p.status !== 'rejected', { workDate: date });
        const ms = await store.list('marks', m => m.date === date, { workDate: date });
        return J(200, { today, date, codes: MARK_CODES, sites: (await store.list('sites')).map(s => ({ id: s.id, name: s.name, project: s.project, pins: s.pins, canSetLocation: (s.locEditors || []).includes(me(req)) })), me: me(req), workers: ws.map(w => ({ id: w.id, code: w.code, name: w.name, shift: w.shift, siteId: w.siteId, punches: ps2.filter(p => p.wid === w.id).map(strip), mark: ms.find(m => m.wid === w.id) || null })) });
      },
      /** No check-in: the supervisor / admin decides what the day is (A, OFF, SL, AL …). Blank code clears the mark. */
      'POST supervisor/mark': async req => {
        if (!isSup(req)) return err(403, 'Supervisor role required');
        const b = req.body || {}, w = await byCode(b.code); if (!w) return err(404, 'Worker not found');
        if (!/^\d{4}-\d{2}-\d{2}$/.test(b.date || '')) return err(400, 'Date required');
        const code = String(b.mark || '').toUpperCase().trim();
        if (code && !MARK_CODES.some(c => c[0] === code)) return err(400, 'Unknown code ' + code);
        const id = w.id + '|' + b.date, old = await store.get('marks', id);
        const m = { id, wid: w.id, code: w.code, name: w.name, date: b.date, workDate: b.date, mark: code, note: String(b.note || '').slice(0, 200), by: req.principal?.userDetails || 'supervisor', at: now(), serverTs: now(), prev: old?.mark || '' };
        await store.put('marks', m); return J(200, { mark: m });
      },
      'POST supervisor/punch': async req => {
        if (!isSup(req)) return err(403, 'Supervisor role required');
        const w = await byCode(req.body?.code); if (!w || !w.enabled) return err(404, 'Worker not found');
        return doPunch(w, req.body, 'supervisor: ' + (req.principal?.userDetails || '?'));
      },
      /** A supervisor the admin allowed for this site sends the site's location from the phone; it waits for the admin's approval */
      'POST supervisor/location': async req => {
        if (!isSup(req)) return err(403, 'Supervisor role required');
        const b = req.body || {}, site = await store.get('sites', String(b.siteId || ''));
        if (!site) return err(404, 'Site not found');
        if (!isAdmin(req) && !(site.locEditors || []).includes(me(req))) return err(403, 'You are not allowed to set the location of this site – ask the admin', 'NOT_ALLOWED');
        const lat = +b.lat, lng = +b.lng, acc = Math.round(+b.acc || 0);

  const mName = x => new Date(+x.slice(0, 4), +x.slice(5) - 1, 1).toLocaleDateString(LANG === 'en' ? 'en-GB' : LANG, { month: 'short', year: 'numeric' });

  shell(`<section class="place"><div class="n">${esc(t('month'))}</div><div class="z"><b>${esc(mName(ym))}</b> · ${esc(P.worker.code)}</div></section>
    <div class="seg">${months.slice(0, 3).map(x => `<button data-m="${x}" class="${x === ym ? 'on' : ''}">${esc(mName(x))}</button>`).join('')}</div>
    <div class="tiles"><div class="tile P"><b>${cnt(/^(P|R)$/)}</b><span>${t('worked')}</span></div><div class="tile"><b>${cnt(/^(OFF|O)$/)}</b><span>${t('off')}</span></div><div class="tile A"><b>${cnt(/^A$/)}</b><span>${t('absent')}</span></div><div class="tile L"><b>${cnt(/^(AL|SL|EL|UL)$/)}</b><span>${t('leave')}</span></div></div>
    <div class="card"><div class="cal">${['S', 'M', 'T', 'W', 'T', 'F', 'S'].map(d => `<div class="h">${d}</div>`).join('')}${'<div></div>'.repeat(first)}${[...Array(N)].map((_, i) => cell(i + 1)).join('')}</div>
      <div class="legend"><span><i style="background:var(--sage)"></i>${t('worked')}</span><span><i style="background:var(--faint)"></i>${t('off')}</span><span><i style="background:var(--red)"></i>${t('absent')}</span><span><i style="background:var(--gold)"></i>${t('leave')}</span></div></div>`, { tab: 'month', crumb: t('month') });

}

 ${installCard()}<p class="note">${t(NT() ? 'locNoteApp' : 'locNote')}</p><p class="k" style="text-align:center;margin-top:18px">LS · ${t('appVer')} 3.0</p>`, { tab: 'more', crumb: t('more') });

/* ---------- supervisor: site board + punch on behalf ---------- */
async function openSupervisor() {
  if (!W.api.demo) {
    const me = await fetch('/.auth/me').then(r => r.json()).catch(() => null);
    const roles = me?.clientPrincipal?.userRoles || [];
    if (!roles.includes('supervisor') && !roles.includes('admin')) { location.href = '/.auth/login/aad?post_login_redirect_uri=' + encodeURIComponent(location.pathname + '#sup'); return; }
  } else W.api = LSClient.make({ base: API_BASE, role: 'supervisor' });
  W.sup = true; startGps(); await loadBoard();
}
/** Supervisor allowed by the admin: take the best GPS fix over ~20 s and send it for the admin's approval (queued when offline) */
async function setSiteLocation(site) {
  if (!site || !navigator.geolocation) return toast('GPS not available');
  let best = null, wid = null;
  const box = document.createElement('div'); box.className = 'sheet-bg';
  box.innerHTML = `<div class="sheet"><b>${esc(site.name)}</b><p class="note" id="sl-st">${t('gpsWait')}</p>
    <label class="fl" for="sl-l">${t('locLabel')}</label><input class="f" id="sl-l" autocomplete="off">
    <label class="fl" for="sl-r" style="margin-top:8px">${t('locRadius')}</label><input class="f" id="sl-r" type="number" min="20" max="1000" value="${site.pins?.[0]?.radius || 100}">
    <div class="row" style="margin-top:12px;gap:8px"><button class="btn" id="sl-x">${t('back')}</button><button class="btn pri grow" id="sl-ok" disabled>${t('sendAdmin')}</button></div></div>`;
  document.body.appendChild(box);
  const st = $('#sl-st', box), ok = $('#sl-ok', box), done = () => { if (wid != null) navigator.geolocation.clearWatch(wid); box.remove(); };
  wid = navigator.geolocation.watchPosition(p => {
    const c = p.coords; if (!best || c.accuracy < best.acc) best = { lat: c.latitude, lng: c.longitude, acc: Math.round(c.accuracy) };
    st.textContent = t('gpsBest').replace('{m}', best.acc); ok.disabled = false;
  }, () => { st.textContent = t('gpsTooWeak').replace('{m}', '?'); }, { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 });
  setTimeout(() => { if (wid != null) { navigator.geolocation.clearWatch(wid); wid = null; } }, 20000);
  $('#sl-x', box).onclick = done;
  ok.onclick = async () => {
    if (best.acc > 30) return toast(t('gpsTooWeak').replace('{m}', best.acc));
    const body = { siteId: site.id, ...best, label: $('#sl-l', box).value.trim(), radius: +$('#sl-r', box).value || 100, clientId: 'loc' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6) };
    done(); await sendLocation(body);
  };
}
async function sendLocation(body) {
  const r = await W.api.call('POST', 'supervisor/location', body).catch(() => null);
  if (r?.status === 200) { haptic(15); toast(t('locSent')); return true; }
  if (!r) { const q = JSON.parse(localStorage.getItem('ls.locq') || '[]'); q.push(body); localStorage.setItem('ls.locq', JSON.stringify(q)); toast(t('locQueued')); }
  else toast(r.body?.error || 'Error');
  return false;
}
/* ---------- report scans: supervisors any report for a person, personnel their own medical report ---------- */
const DOC_T = ['ATT', 'VEH', 'SVR', 'MPR', 'MED'];
function scanReport(who, sup) {
  const pages = [], box = document.createElement('div'); box.className = 'sheet-bg';
  const ym = new Date().toISOString().slice(0, 7);
  box.innerHTML = `<div class="sheet"><b>${t('scanTitle')}</b><p class="note">${esc(tc(who.name))} · ${esc(who.code)}</p>
    ${sup ? `<label class="fl" for="sr-t">${t('scanType')}</label><select class="f" id="sr-t">${DOC_T.map(k => `<option value="${k}">${t('doc' + k)}</option>`).join('')}</select>` : `<p class="note">${t('docMED')}</p>`}
    <div class="scan-pages" id="sr-p"></div><p class="note" id="sr-n">${t('scanHint')}</p>
    <label class="btn wide" style="margin-top:8px">${ic('camera')} ${t('scanAdd')}<input type="file" id="sr-f" accept="image/*" capture="environment" multiple hidden></label>
    <div class="row" style="margin-top:12px;gap:8px"><button class="btn" id="sr-x">${t('back')}</button><button class="btn pri grow" id="sr-ok" disabled>${t('scanSend')}</button></div></div>`;
  document.body.appendChild(box);
  const draw = () => { $('#sr-p', box).innerHTML = pages.map((p, i) => `<span><img src="${p}" alt=""><button data-del="${i}" aria-label="remove">✕</button><b>${i + 1}</b></span>`).join(''); $('#sr-ok', box).disabled = !pages.length; $('#sr-n', box).textContent = pages.length ? `${pages.length} ${t('scanPages')}` : t('scanHint');
    box.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { pages.splice(+b.dataset.del, 1); draw(); }); };
  $('#sr-f', box).onchange = async e => { for (const f of e.target.files) { try { pages.push(await shrinkPage(f)); } catch (x) { toast('?'); } } e.target.value = ''; draw(); };
  $('#sr-x', box).onclick = () => box.remove();
  $('#sr-ok', box).onclick = async () => {
    const body = { code: who.code, type: sup ? $('#sr-t', box).value : 'MED', ym, pages: pages.slice(), clientId: 'doc' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6) };
    box.remove(); await sendDoc(body, sup);
  };
}
/** a photo of a page → JPEG data URL, longest side 1600 px */
async function shrinkPage(f) {
  const bmp = await createImageBitmap(f), k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height)), c = document.createElement('canvas');
  c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k); c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.72);
}
async function sendDoc(body, sup) {
  const r = await W.api.call('POST', sup ? 'supervisor/doc' : 'worker/doc', body, sup ? {} : { token: W.token }).catch(() => null);
  if (r?.status === 200) { haptic(15); toast(t('scanSent')); return true; }
  if (!r) { await qPut({ clientId: body.clientId, doc: true, sup, body }); toast(t('scanQueued')); updateQueueBar?.(); }
  else toast(r.body?.error || 'Error');
  return false;
}
async function flushDocs(sup) { for (const x of await qAll()) if (x.doc && !!x.sup === !!sup) { const r = await W.api.call('POST', sup ? 'supervisor/doc' : 'worker/doc', x.body, sup ? {} : { token: W.token }).catch(() => null); if (!r) break; await qDel(x.clientId); if (r.status === 200) toast(t('scanSent')); } }
async function flushLocations() { let q = []; try { q = JSON.parse(localStorage.getItem('ls.locq') || '[]'); } catch (e) { } if (!q.length) return; localStorage.setItem('ls.locq', '[]'); for (const b of q) await sendLocation(b); }
async function loadBoard(redraw = true) {
  const r = await W.api.call('GET', 'supervisor/board', null, { query: { site: W.supSite || '', date: W.supDate || '' } }).catch(() => null);
  if (r?.status !== 200) { toast(r?.body?.error || 'No connection'); W.sup = false; return render(); }
  W.board = r.body; W.prof ||= { sites: r.body.sites, site: null, punches: [] }; if (redraw) renderSup();
  flushLocations(); flushDocs(true);
}
function renderSup() {
  const B = W.board || { workers: [], sites: [], codes: [] }, isToday = B.date === B.today;
  const state = w => { const ins = w.punches.filter(p => p.type === 'in'), outs = w.punches.filter(p => p.type === 'out'); return ins.length > outs.length ? 'in' : ins.length ? 'done' : w.mark?.mark ? 'marked' : 'none'; };
  const base = B.workers.filter(w => !W.supSite || w.siteId === W.supSite);
  const n = k => base.filter(w => state(w) === k).length;
  const f = W.supF || 'all', q = (W.supQ || '').trim().toUpperCase();
  const rows = base.filter(w => (f === 'all' || state(w) === f || (f === 'none' && state(w) === 'marked')) && (!q || w.name.toUpperCase().includes(q) || w.code.toUpperCase().includes(q)));
  const ord = { none: 0, marked: 1, in: 2, done: 3 };
  shell(`<section class="place"><div class="n">${t('supervisor')}</div><div class="z"><b>${esc(B.sites.find(x => x.id === W.supSite)?.name || t('all'))}</b> · ${esc(B.date || '')}</div></section>
    <div class="card"><div class="row"><div class="grow"><label class="fl" for="sp-site">${t('site')}</label><select class="f" id="sp-site"><option value="">${t('all')}</option>${B.sites.map(s => `<option value="${esc(s.id)}" ${s.id === W.supSite ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select></div>
      <div><label class="fl" for="sp-date">${t('date')}</label><input class="f" type="date" id="sp-date" value="${esc(B.date)}" max="${esc(B.today)}"></div></div>
    <div class="chips">${[['all', t('all'), base.length], ['none', t('notIn'), n('none') + n('marked')], ['in', t('inNow'), n('in')], ['done', t('doneLbl'), n('done')]].map(([k, l, c]) => `<button data-f="${k}" class="${f === k ? 'on' : ''}">${l} <b>${c}</b></button>`).join('')}</div>
    <p class="note" style="margin:10px 2px 0">${n('in')} in · ${n('done')} ${t('doneLbl').toLowerCase()} · ${n('none')} ${t('noCheckIn')}${n('marked') ? ` · ${n('marked')} ${t('marked')}` : ''}</p>
    <div class="srch">${ic('search')}<input class="f" id="sp-q" placeholder="${t('search')}" value="${esc(W.supQ || '')}" autocomplete="off"></div></div>
    ${n('none') ? `<div class="q">${ic('info')}<span>${t('markHint')}</span></div>` : ''}
    <div class="card" style="padding:4px 16px"><ul class="list sup">${rows.sort((a, b) => ord[state(a)] - ord[state(b)]).map(w => { const s = state(w); return `<li><span class="av">${initials(w.name)}<i class="${s}"></i></span><span class="grow"><span class="what">${esc(tc(w.name))}</span><span class="sub mono">${esc(w.code)} · ${esc(w.shift)}${w.punches.length ? ' · ' + w.punches.map(p => (p.type === 'in' ? '↘' : '↗') + hhmm(p.ts)).join(' ') : ''}</span></span>
      ${(s === 'none' || s === 'marked') || (isToday && s !== 'done') ? `<div class="acts">${s === 'none' || s === 'marked' ? `<select class="f" data-mk="${esc(w.code)}"><option value="">${s === 'marked' ? '✕ ' + t('clear') : t('markAs')}</option>${B.codes.map(([c, l]) => `<option value="${c}" ${w.mark?.mark === c ? 'selected' : ''}>${c} – ${esc(l)}</option>`).join('')}</select>` : ''}
      ${isToday && s !== 'done' ? `<button class="btn ${s === 'in' ? '' : 'pri'}" data-pw="${esc(w.code)}" data-t="${s === 'in' ? 'out' : 'in'}">${ic(s === 'in' ? 'out' : 'in')} ${s === 'in' ? t('checkOut') : t('checkIn')}</button>` : ''}</div>` : ''}<button class="ib scanb" data-scan="${esc(w.code)}" aria-label="${t('scanTitle')}" title="${t('scanTitle')}">${ic('camera')}</button></li>`; }).join('') || `<li><div class="empty grow">${ic('inbox')}<span>—</span></div></li>`}</ul></div>
    ${B.sites.some(s => s.canSetLocation) ? `<div class="card"><b>${t('setLocTitle')}</b><p class="note" style="margin:6px 0 10px">${t('setLocHint')}</p>${B.sites.filter(s => s.canSetLocation).map(s => `<button class="btn wide" data-setloc="${esc(s.id)}" style="margin-top:6px">${ic('pin')} ${t('setLocHere')} – ${esc(s.name)}</button>`).join('')}</div>` : ''}
    <div id="gps"></div><button class="btn wide" id="b-exit" style="margin-top:10px">${ic('back')} ${t('back')}</button>`, { tabs: false, crumb: t('supervisor') });
  $$('[data-scan]').forEach(b => b.onclick = () => scanReport(B.workers.find(x => x.code === b.dataset.scan), true));
  $$('[data-setloc]').forEach(b => b.onclick = () => setSiteLocation(B.sites.find(s => s.id === b.dataset.setloc)));
  $('#sp-site').onchange = e => { W.supSite = e.target.value; loadBoard(); };
  $('#sp-date').onchange = e => { W.supDate = e.target.value; loadBoard(); };
  $$('[data-f]').forEach(b => b.onclick = () => { W.supF = b.dataset.f; renderSup(); });
  $('#sp-q').oninput = e => { W.supQ = e.target.value; const pos = e.target.selectionStart; renderSup(); const i = $('#sp-q'); i.focus(); try { i.setSelectionRange(pos, pos); } catch (x) { } };
  $$('[data-pw]').forEach(b => b.onclick = () => { const w = B.workers.find(x => x.code === b.dataset.pw); punch(b.dataset.t, w); });
  $$('[data-mk]').forEach(sel => sel.onchange = async () => {
    const r = await W.api.call('POST', 'supervisor/mark', { code: sel.dataset.mk, date: B.date, mark: sel.value }).catch(() => null);
    if (r?.status === 200) { haptic(15); toast(sel.value ? `${sel.dataset.mk} → ${sel.value}` : t('clear')); loadBoard(); } else toast(r?.body?.error || 'No connection');
  });
  $('#b-exit').onclick = () => { W.sup = false; W.api = LSClient.make({ base: API_BASE }); render(); };
  paintGps();
}
function signOut(expired) { syncBackground(false); W.token = null; W.prof = null; ss.set('ls.tok', null); ss.set('ls.prof', null); W.sup = false; SCREEN = 'login'; if (expired === true) W.err = ''; render(); }

if (window.isSecureContext && location.protocol.startsWith('http') && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { });

LSMap.load().catch(() => { });                 // fetch the map library while the profile loads
(async () => {
  // signed in before: draw Today from the last profile at once, then bring it up to date in the background

  if (W.token) { await refresh(); if (W.prof) { SCREEN = 'home'; startGps(); flushQueue(); } else { W.token = null; } }

setInterval(() => { if (W.prof && !W.sup && SCREEN === 'home' && !$('.cam') && !W.busy && !$('.mapcard.full')) refresh(); }, 120000);
